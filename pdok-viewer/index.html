  <script async src="https://plausible.io/js/pa-unGG15m6r6ufvAQNAPz3f.js"></script>
  <script>
    window.plausible = window.plausible || function() { (plausible.q = plausible.q || []).push(arguments) };
    plausible.init = plausible.init || function(i) { plausible.o = i || {} };
    plausible.init();
  </script>

  <!-- MapLibre CSS (link can stay in head) -->
  <link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      overflow: hidden;
    }

    #map { width: 100vw; height: 100vh; }

    /* ─── Side panel ─── */
    #panel {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 340px;
      background: #161b22;
      border-left: 1px solid #30363d;
      display: flex; flex-direction: column;
      z-index: 30;
      overflow-y: auto;
    }

    #panel::-webkit-scrollbar { width: 4px; }
    #panel::-webkit-scrollbar-track { background: transparent; }
    #panel::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    .panel-header {
      padding: 18px 18px 14px;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }
    .panel-header h1 { font-size: 14px; font-weight: 700; color: #f0f6fc; }
    .panel-header p  { font-size: 11px; color: #7d8590; margin-top: 3px; line-height: 1.5; }

    .section {
      padding: 16px 18px;
      border-bottom: 1px solid #21262d;
    }

    .section-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #484f58; margin-bottom: 12px;
    }

    /* ─── Year display ─── */
    #year-display {
      font-size: 36px; font-weight: 800; color: #f0f6fc;
      line-height: 1; margin-bottom: 4px;
      font-variant-numeric: tabular-nums;
    }

    #season-badge {
      display: inline-block;
      font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase;
      padding: 2px 8px; border-radius: 20px; margin-bottom: 14px;
    }
    .badge-zomer { background: rgba(240,165,0,0.14); color: #e3b341; border: 1px solid rgba(240,165,0,0.3); }
    .badge-winter { background: rgba(100,180,255,0.10); color: #79c0ff; border: 1px solid rgba(100,180,255,0.25); }

    /* ─── Slider ─── */
    .slider-wrap { position: relative; margin-bottom: 4px; }

    input[type=range] {
      -webkit-appearance: none; appearance: none;
      width: 100%; height: 3px;
      background: #30363d; border-radius: 2px;
      outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px; height: 16px; border-radius: 50%;
      background: #e3b341; border: 2px solid #0d1117;
      cursor: pointer; transition: transform 0.1s;
    }
    input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.25); }

    .year-ticks {
      display: flex; justify-content: space-between;
      margin-top: 6px;
    }
    .year-ticks span { font-size: 9px; color: #484f58; user-select: none; }

    /* ─── Season toggle ─── */
    .toggle-row { display: flex; gap: 6px; }

    .toggle-btn {
      flex: 1; padding: 7px 0;
      border: 1px solid #30363d;
      background: transparent; color: #484f58;
      border-radius: 6px; font-family: inherit;
      font-size: 10px; letter-spacing: 0.05em;
      cursor: pointer; transition: all 0.15s;
    }
    .toggle-btn.active {
      background: #e3b341; border-color: #e3b341;
      color: #000; font-weight: 700;
    }
    .toggle-btn:not(.active):hover { border-color: #58a6ff; color: #58a6ff; }

    #res-note { font-size: 10px; color: #484f58; margin-top: 10px; line-height: 1.5; }

    /* ─── Opacity ─── */
    #opacity-val { float: right; color: #e3b341; font-size: 11px; }

    /* ─── WFS section ─── */
    .input-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
    .input-group label { font-size: 10px; color: #484f58; letter-spacing: 0.05em; }

    .input-group input[type=text],
    .input-group select {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 6px; color: #e6edf3;
      font-family: inherit; font-size: 11px;
      padding: 7px 10px; width: 100%; outline: none;
      transition: border-color 0.15s;
    }
    .input-group input[type=text]:focus,
    .input-group select:focus { border-color: #388bfd; }

    .btn-primary {
      width: 100%; padding: 9px;
      background: #1f6feb; border: none; border-radius: 6px;
      color: #fff; font-family: inherit;
      font-size: 12px; font-weight: 700;
      cursor: pointer; transition: background 0.15s;
    }
    .btn-primary:hover:not(:disabled) { background: #388bfd; }
    .btn-primary:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    #data-status {
      font-size: 10px; color: #7d8590; margin-top: 8px; min-height: 14px; line-height: 1.5;
    }
    #data-status.error { color: #f85149; }
    #data-status.ok    { color: #56d364; }

    /* ─── Quick examples ─── */
    .example-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.5px; color: #484f58; margin-bottom: 8px;
    }
    .example-chip {
      display: inline-block; margin: 0 4px 4px 0;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 5px; padding: 4px 9px;
      font-size: 10px; color: #58a6ff; cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }
    .example-chip:hover { background: #21262d; border-color: #58a6ff; }

    /* ─── Legend / data info ─── */
    #legend-wrap { display: none; }
    #legend-info {
      font-size: 11px; color: #c9d1d9; line-height: 1.6;
    }
    #legend-info span { color: #58a6ff; font-weight: 600; }

    /* ─── Loading bar ─── */
    #loading-bar {
      position: fixed; top: 0; left: 0; right: 340px; height: 2px; z-index: 40;
      pointer-events: none; overflow: hidden;
    }
    #loading-bar.active::after {
      content: '';
      position: absolute; top: 0; height: 100%; width: 45%;
      background: linear-gradient(90deg, transparent, #388bfd, transparent);
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer { from { left: -45%; } to { left: 100%; } }

    /* ─── Popup ─── */
    .maplibregl-popup-content {
      background: rgba(13,17,23,0.97) !important;
      border: 1px solid #30363d !important;
      border-radius: 8px !important;
      color: #e6edf3 !important;
      font-family: inherit !important;
      padding: 0 !important;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6) !important;
    }
    .maplibregl-popup-tip { display: none !important; }
    .popup-inner { padding: 10px 13px; font-size: 11px; line-height: 1.7; max-height: 280px; overflow-y: auto; }
    .popup-inner b { color: #79c0ff; margin-right: 5px; }

    /* ─── Mobile ─── */
    @media (max-width: 700px) {
      #panel {
        top: auto; right: 0; left: 0; bottom: 0;
        width: 100%; height: 52vh;
        border-left: none; border-top: 1px solid #30363d;
      }
      #loading-bar { right: 0; }
    }
  </style>

<body>

  <a href="/" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(13,17,23,0.85);color:#58a6ff;font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;border:1px solid #30363d;text-decoration:none;backdrop-filter:blur(4px);">← Maps That Matter</a>

  <div id="loading-bar"></div>
  <div id="map"></div>

  <!-- ══════════════ PANEL ══════════════ -->
  <div id="panel">

    <div class="panel-header">
      <h1>PDOK Verkenner</h1>
      <p>Luchtfoto per jaar · Open geodata</p>
    </div>

    <!-- ── Luchtfoto jaargang ── -->
    <div class="section">
      <div class="section-label">Luchtfoto Jaargang</div>

      <div id="year-display">2024</div>
      <div id="season-badge" class="badge-zomer">Zomer · 25 cm</div>

      <div class="slider-wrap">
        <input type="range" id="year-slider" min="0" max="7" value="7" step="1" />
        <div class="year-ticks">
          <span>2016</span>
          <span>2019</span>
          <span>2022</span>
          <span>2024</span>
        </div>
      </div>

      <div class="toggle-row" style="margin-top:14px">
        <button class="toggle-btn active" id="btn-zomer">☀ Zomer 25cm</button>
        <button class="toggle-btn" id="btn-winter">❄ Winter 8cm</button>
      </div>

      <p id="res-note">Zomeropname · resolutie 25 cm · CC BY Kadaster / PDOK</p>
    </div>

    <!-- ── Opacity ── -->
    <div class="section">
      <div class="section-label">
        Luchtfoto Dekking
        <span id="opacity-val">100%</span>
      </div>
      <input type="range" id="opacity-slider" min="0" max="100" value="100" step="1" />
    </div>

    <!-- ── WFS data laag ── -->
    <div class="section">
      <div class="section-label">Data Laag (WFS)</div>

      <div class="example-label">Voorbeelden</div>
      <div style="margin-bottom:12px">
        <span class="example-chip" onclick="fillExample('bag')">BAG Panden</span>
        <span class="example-chip" onclick="fillExample('cbs')">CBS Buurten</span>
        <span class="example-chip" onclick="fillExample('natuur')">Natura 2000</span>
        <span class="example-chip" onclick="fillExample('bestemmingsplan')">Bestemmingsplan</span>
      </div>

      <div class="input-group">
        <label>WFS Service URL</label>
        <input type="text" id="wfs-url" placeholder="https://service.pdok.nl/…/wfs/v1_0" />
      </div>

      <div class="input-group">
        <label>Laagnaam (TypeName)</label>
        <input type="text" id="wfs-layer" placeholder="bijv. bag:pand" />
      </div>

      <div class="input-group">
        <label>Max. features (huidige kaartextent)</label>
        <select id="wfs-max">
          <option value="500">500</option>
          <option value="1000" selected>1000</option>
          <option value="2500">2500</option>
          <option value="5000">5000</option>
        </select>
      </div>

      <button class="btn-primary" id="btn-load">Ophalen &amp; Tonen</button>
      <div id="data-status"></div>
    </div>

    <!-- ── Data info (shown after load) ── -->
    <div class="section" id="legend-wrap">
      <div class="section-label">Geladen Laag</div>
      <div id="legend-info"></div>
    </div>

  </div><!-- /panel -->

  <!-- MapLibre GL — must load before inline script -->
  <script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>
  <script>
    // ─────────────────────────────────────────────────────────────
    // Luchtfoto year config
    // 2021 ontbreekt (PDOK heeft geen landsdekkend mozaïek voor dat jaar)
    // ─────────────────────────────────────────────────────────────
    const ZOMER_YEARS  = [2016,2017,2018,2019,2020,2022,2023,2024,2025];
    const WINTER_YEARS = [2016,2017,2018,2019,2020,2022,2023,2024,2025];

    let season    = 'zomer';
    let yearIndex = 8;  // index into current year array (2025)

    function currentYears() { return season === 'zomer' ? ZOMER_YEARS : WINTER_YEARS; }

    function wmtsTileUrl(year, s) {
      // PDOK WMTS REST style. 8cm layer name is {year}_orthoHR (not ortho8).
      // Format is JPEG. TileMatrixSet is EPSG:3857.
      // REST template: /{layer}/EPSG:3857/{z}/{y}/{x}.jpeg
      const layer = s === 'zomer' ? year + '_ortho25' : year + '_orthoHR';
      return 'https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0/'
           + layer + '/EPSG:3857/{z}/{y}/{x}.jpeg';
    }

    // ─────────────────────────────────────────────────────────────
    // MapLibre
    // ─────────────────────────────────────────────────────────────
    const map = new maplibregl.Map({
      container: 'map',
      style: {
        version: 8,
        sources: {
          'carto': {
            type: 'raster',
            tiles: ['https://basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],
            tileSize: 256,
            attribution: '© OpenStreetMap contributors · © CARTO'
          }
        },
        layers: [{ id: 'carto-bg', type: 'raster', source: 'carto' }]
      },
      center: [4.5, 52.15],
      zoom: 9,
      attributionControl: false
    });

    map.addControl(new maplibregl.NavigationControl(), 'top-left');
    map.addControl(new maplibregl.AttributionControl({
      customAttribution: 'Kadaster / PDOK – CC BY 4.0'
    }), 'bottom-left');

    // ─────────────────────────────────────────────────────────────
    // Luchtfoto layer
    // ─────────────────────────────────────────────────────────────
    function updateLuchtfoto() {
      const years = currentYears();
      yearIndex = Math.min(yearIndex, years.length - 1);
      const year  = years[yearIndex];
      const url   = wmtsTileUrl(year, season);
      const opacity = parseInt(document.getElementById('opacity-slider').value) / 100;

      // Update UI labels
      document.getElementById('year-display').textContent = year;
      const badge = document.getElementById('season-badge');
      const note  = document.getElementById('res-note');
      if (season === 'zomer') {
        badge.textContent = 'Zomer · 25 cm';
        badge.className   = 'badge-zomer';
        note.textContent  = 'Zomeropname · resolutie 25 cm · CC BY Kadaster / PDOK';
      } else {
        badge.textContent = 'Winter · 8 cm';
        badge.className   = 'badge-winter';
        note.textContent  = 'Winteropname · resolutie 8 cm · CC BY Kadaster / PDOK';
      }

      // Sync slider
      const slider = document.getElementById('year-slider');
      slider.max   = years.length - 1;
      slider.value = yearIndex;

      setLoading(true);

      if (map.getLayer('luchtfoto')) map.removeLayer('luchtfoto');
      if (map.getSource('luchtfoto')) map.removeSource('luchtfoto');

      // Find first data layer to insert luchtfoto beneath it
      const dataLayers = ['wfs-fill','wfs-line','wfs-circle'];
      const beforeId   = dataLayers.find(id => map.getLayer(id));

      map.addSource('luchtfoto', {
        type: 'raster',
        tiles: [url],
        tileSize: 256,
        attribution: 'Kadaster / PDOK – CC BY 4.0'
      });

      map.addLayer({
        id: 'luchtfoto',
        type: 'raster',
        source: 'luchtfoto',
        paint: { 'raster-opacity': opacity }
      }, beforeId);

      map.once('idle', () => setLoading(false));
      setTimeout(() => setLoading(false), 8000);
    }

    map.on('load', updateLuchtfoto);

    // ─────────────────────────────────────────────────────────────
    // Slider
    // ─────────────────────────────────────────────────────────────
    document.getElementById('year-slider').addEventListener('input', e => {
      yearIndex = parseInt(e.target.value);
      updateLuchtfoto();
    });

    // ─────────────────────────────────────────────────────────────
    // Season toggle
    // ─────────────────────────────────────────────────────────────
    document.getElementById('btn-zomer').addEventListener('click', () => {
      if (season === 'zomer') return;
      season = 'zomer';
      document.getElementById('btn-zomer').classList.add('active');
      document.getElementById('btn-winter').classList.remove('active');
      yearIndex = Math.min(yearIndex, ZOMER_YEARS.length - 1);
      updateLuchtfoto();
    });

    document.getElementById('btn-winter').addEventListener('click', () => {
      if (season === 'winter') return;
      season = 'winter';
      document.getElementById('btn-winter').classList.add('active');
      document.getElementById('btn-zomer').classList.remove('active');
      yearIndex = Math.min(yearIndex, WINTER_YEARS.length - 1);
      updateLuchtfoto();
    });

    // ─────────────────────────────────────────────────────────────
    // Opacity
    // ─────────────────────────────────────────────────────────────
    document.getElementById('opacity-slider').addEventListener('input', e => {
      const v = parseInt(e.target.value) / 100;
      document.getElementById('opacity-val').textContent = e.target.value + '%';
      if (map.getLayer('luchtfoto')) {
        map.setPaintProperty('luchtfoto', 'raster-opacity', v);
      }
    });

    // ─────────────────────────────────────────────────────────────
    // WFS examples
    // ─────────────────────────────────────────────────────────────
    const EXAMPLES = {
      bag:             { url: 'https://service.pdok.nl/lv/bag/wfs/v2_0',                               layer: 'bag:pand' },
      cbs:             { url: 'https://service.pdok.nl/cbs/wijkenbuurten/2023/wfs/v1_0',               layer: 'cbs_buurten_2023:cbs_buurten_2023' },
      natuur:          { url: 'https://service.pdok.nl/minlnv/natura2000/wfs/v1_0',                    layer: 'natura2000:natura2000' },
      bestemmingsplan: { url: 'https://service.pdok.nl/kadaster/bestemmingsplannen/wfs/v1_0',          layer: 'bestemmingsplannen:bestemmingsvlak' },
    };

    function fillExample(key) {
      const ex = EXAMPLES[key];
      if (!ex) return;
      document.getElementById('wfs-url').value   = ex.url;
      document.getElementById('wfs-layer').value = ex.layer;
    }
    window.fillExample = fillExample;

    // ─────────────────────────────────────────────────────────────
    // WFS loading
    // ─────────────────────────────────────────────────────────────
    document.getElementById('btn-load').addEventListener('click', loadWFS);

    async function loadWFS() {
      const baseUrl  = document.getElementById('wfs-url').value.trim();
      const typeName = document.getElementById('wfs-layer').value.trim();
      const maxFeat  = document.getElementById('wfs-max').value;
      const statusEl = document.getElementById('data-status');

      if (!baseUrl || !typeName) {
        statusEl.textContent = 'Vul een WFS URL en laagnaam in.';
        statusEl.className   = 'error';
        return;
      }

      const b    = map.getBounds();
      const bbox = `${b.getWest()},${b.getSouth()},${b.getEast()},${b.getNorth()},EPSG:4326`;
      const sep  = baseUrl.includes('?') ? '&' : '?';
      const url  = `${baseUrl}${sep}SERVICE=WFS&VERSION=2.0.0&REQUEST=GetFeature`
                 + `&TYPENAMES=${encodeURIComponent(typeName)}`
                 + `&BBOX=${encodeURIComponent(bbox)}`
                 + `&COUNT=${maxFeat}`
                 + `&OUTPUTFORMAT=application%2Fjson`;

      statusEl.textContent = 'Ophalen…';
      statusEl.className   = '';
      document.getElementById('btn-load').disabled = true;
      setLoading(true);

      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error(`HTTP ${resp.status} – ${resp.statusText}`);
        const geojson = await resp.json();

        if (!geojson.features?.length) {
          statusEl.textContent = 'Geen features gevonden in dit kaartgebied. Zoom in of pan naar het juiste gebied.';
          statusEl.className   = 'error';
          return;
        }

        renderWFS(geojson, typeName);
        statusEl.textContent = `✓ ${geojson.features.length.toLocaleString('nl-NL')} features geladen`;
        statusEl.className   = 'ok';

      } catch (err) {
        statusEl.textContent = `Fout: ${err.message}`;
        statusEl.className   = 'error';
      } finally {
        document.getElementById('btn-load').disabled = false;
        setLoading(false);
      }
    }

    // ─────────────────────────────────────────────────────────────
    // Render WFS GeoJSON
    // ─────────────────────────────────────────────────────────────
    function renderWFS(geojson, typeName) {
      ['wfs-fill','wfs-line','wfs-circle'].forEach(id => {
        if (map.getLayer(id)) map.removeLayer(id);
      });
      if (map.getSource('wfs')) map.removeSource('wfs');

      map.addSource('wfs', { type: 'geojson', data: geojson });

      const geomType = inferGeomType(geojson);
      let clickLayer;

      if (geomType === 'polygon') {
        map.addLayer({
          id: 'wfs-fill', type: 'fill', source: 'wfs',
          paint: { 'fill-color': '#1f6feb', 'fill-opacity': 0.22 }
        });
        map.addLayer({
          id: 'wfs-line', type: 'line', source: 'wfs',
          paint: { 'line-color': '#388bfd', 'line-width': 1 }
        });
        clickLayer = 'wfs-fill';
      } else if (geomType === 'line') {
        map.addLayer({
          id: 'wfs-line', type: 'line', source: 'wfs',
          paint: { 'line-color': '#388bfd', 'line-width': 2 }
        });
        clickLayer = 'wfs-line';
      } else {
        map.addLayer({
          id: 'wfs-circle', type: 'circle', source: 'wfs',
          paint: {
            'circle-radius': 4,
            'circle-color': '#388bfd',
            'circle-stroke-width': 1,
            'circle-stroke-color': '#0d1117'
          }
        });
        clickLayer = 'wfs-circle';
      }

      // Info section
      document.getElementById('legend-wrap').style.display = 'block';
      const shortName = typeName.split(':').pop();
      document.getElementById('legend-info').innerHTML =
        `<span>${geojson.features.length.toLocaleString('nl-NL')}</span> features · ${esc(shortName)}`;

      // Popups
      map.off('click', 'wfs-fill',   onFeatureClick);
      map.off('click', 'wfs-line',   onFeatureClick);
      map.off('click', 'wfs-circle', onFeatureClick);
      map.on('click', clickLayer, onFeatureClick);

      map.on('mouseenter', clickLayer, () => { map.getCanvas().style.cursor = 'pointer'; });
      map.on('mouseleave', clickLayer, () => { map.getCanvas().style.cursor = ''; });
    }

    function onFeatureClick(e) {
      const props = e.features[0].properties;
      const rows  = Object.entries(props)
        .filter(([, v]) => v !== null && v !== '')
        .slice(0, 16)
        .map(([k, v]) => `<div><b>${esc(k)}</b>${esc(String(v))}</div>`)
        .join('');
      new maplibregl.Popup({ maxWidth: '300px', closeButton: true })
        .setLngLat(e.lngLat)
        .setHTML(`<div class="popup-inner">${rows}</div>`)
        .addTo(map);
    }

    function inferGeomType(geojson) {
      const t = geojson.features[0]?.geometry?.type || '';
      if (t.includes('Polygon')) return 'polygon';
      if (t.includes('Line'))    return 'line';
      return 'point';
    }

    // ─────────────────────────────────────────────────────────────
    // Utilities
    // ─────────────────────────────────────────────────────────────
    function setLoading(on) {
      document.getElementById('loading-bar').classList.toggle('active', on);
    }

    function esc(s) {
      return String(s).replace(/[<>&"]/g,
        c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));
    }
  </script>
</body>
</html>
