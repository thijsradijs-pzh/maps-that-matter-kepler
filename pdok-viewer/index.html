<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>PDOK Verkenner — Maps That Matter</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />

  <script async src="https://plausible.io/js/pa-unGG15m6r6ufvAQNAPz3f.js"></script>
  <script>
    window.plausible = window.plausible || function() { (plausible.q = plausible.q || []).push(arguments) };
    plausible.init = plausible.init || function(i) { plausible.o = i || {} };
    plausible.init();
  </script>

  <script src="https://unpkg.com/h3-js@3.7.2/dist/h3-js.umd.js"></script>
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
  <script src="/shared/deckgl-utils.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      overflow: hidden;
    }

    #container { width: 100vw; height: 100vh; }

    /* ─── Side panel ─── */
    #panel {
      position: absolute; top: 0; right: 0; bottom: 0;
      width: 380px;
      background: #161b22;
      border-left: 1px solid #21262d;
      display: flex; flex-direction: column;
      z-index: 10;
    }

    .panel-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid #21262d;
      flex-shrink: 0;
    }
    .panel-header h1 {
      font-size: 14px; font-weight: 700; color: #f0f6fc;
      letter-spacing: -0.2px;
    }
    .panel-header p {
      font-size: 11px; color: #7d8590; margin-top: 3px; line-height: 1.5;
    }

    /* Step indicator */
    .steps-row {
      display: flex; gap: 4px; margin-top: 12px;
    }
    .step-pill {
      flex: 1; height: 3px; border-radius: 2px;
      background: #21262d; transition: background 0.4s;
    }
    .step-pill.done   { background: #1f6feb; }
    .step-pill.active { background: #58a6ff; animation: step-pulse 1.2s ease-in-out infinite alternate; }
    @keyframes step-pulse { to { opacity: 0.45; } }

    /* Messages feed */
    #messages {
      flex: 1; overflow-y: auto;
      padding: 14px 14px 8px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: #30363d; border-radius: 2px; }

    /* Input bar */
    #input-area {
      flex-shrink: 0;
      padding: 12px 14px;
      border-top: 1px solid #21262d;
      background: #161b22;
    }
    .input-row { display: flex; gap: 8px; align-items: center; }
    #question-input {
      flex: 1;
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 8px; padding: 9px 12px;
      font-size: 13px; color: #e6edf3; outline: none;
      font-family: inherit; transition: border-color 0.15s;
    }
    #question-input::placeholder { color: #484f58; }
    #question-input:focus { border-color: #388bfd; }
    #submit-btn {
      background: #1f6feb; border: none; border-radius: 8px;
      color: #fff; font-size: 16px; font-weight: 600;
      width: 36px; height: 36px; flex-shrink: 0;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    #submit-btn:hover:not(:disabled) { background: #388bfd; }
    #submit-btn:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    /* ─── Message types ─── */

    /* User bubble */
    .msg-user {
      align-self: flex-end;
      background: #1f6feb; border-radius: 12px 12px 4px 12px;
      padding: 9px 13px; font-size: 12px; color: #fff;
      max-width: 86%; line-height: 1.5;
    }

    /* Error */
    .msg-error {
      background: rgba(248,81,73,0.08);
      border: 1px solid rgba(248,81,73,0.25);
      border-radius: 8px; padding: 10px 14px;
      font-size: 12px; color: #f85149; line-height: 1.5;
    }

    /* Thinking card */
    .card-thinking {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; padding: 12px 14px;
      display: flex; flex-direction: column; gap: 6px;
    }
    .think-step {
      display: flex; align-items: center; gap: 9px;
      font-size: 12px; color: #484f58; line-height: 1.4;
      transition: color 0.2s;
    }
    .think-step.active { color: #c9d1d9; }
    .think-step.done   { color: #56d364; }
    .think-icon { width: 14px; flex-shrink: 0; font-size: 12px; text-align: center; }
    .think-icon.spin { animation: spin 0.8s linear infinite; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* AI analysis card */
    .card-ai {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; overflow: hidden;
    }
    .card-ai-header {
      padding: 12px 14px 10px;
    }
    .card-ai-title {
      font-size: 13px; font-weight: 600; color: #f0f6fc; margin-bottom: 5px;
    }
    .card-ai-reasoning {
      font-size: 11px; color: #8b949e; line-height: 1.65;
    }
    .card-ai-tags {
      padding: 8px 14px 12px;
      border-top: 1px solid #21262d;
      display: flex; flex-wrap: wrap; gap: 5px;
    }
    .tag {
      background: #0d1117; border: 1px solid #30363d;
      border-radius: 5px; padding: 3px 8px;
      font-size: 10px; font-family: 'SF Mono', 'Fira Mono', monospace;
      color: #7d8590;
    }
    .tag.blue { border-color: #1f4f8e; color: #79c0ff; background: rgba(31,79,142,0.15); }
    .tag.green { border-color: #196127; color: #56d364; background: rgba(25,97,39,0.15); }

    /* Draw area prompt card */
    .card-draw-prompt {
      background: linear-gradient(160deg, #0f2643 0%, #091e36 100%);
      border: 1px solid #1f4f8e; border-radius: 10px;
      padding: 16px;
    }
    .card-draw-prompt .dp-icon {
      font-size: 22px; margin-bottom: 8px; line-height: 1;
    }
    .card-draw-prompt .dp-title {
      font-size: 13px; font-weight: 700; color: #79c0ff; margin-bottom: 6px;
    }
    .card-draw-prompt .dp-desc {
      font-size: 12px; color: #7d8590; line-height: 1.65; margin-bottom: 10px;
    }
    .card-draw-prompt .dp-hint {
      font-size: 11px; color: #388bfd; line-height: 1.6;
      background: rgba(56,139,253,0.08); border: 1px solid rgba(56,139,253,0.2);
      border-radius: 6px; padding: 8px 10px;
    }

    /* Result card */
    .card-result {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; overflow: hidden;
    }
    .card-result-header {
      padding: 12px 14px 10px;
    }
    .card-result-title {
      font-size: 13px; font-weight: 600; color: #f0f6fc; margin-bottom: 4px;
    }
    .card-result-subtitle {
      font-size: 11px; color: #7d8590;
    }
    .card-result-stats {
      padding: 8px 14px 10px;
      border-top: 1px solid #21262d;
      display: flex; flex-direction: column; gap: 5px;
    }
    .stat-row {
      display: flex; justify-content: space-between;
      font-size: 11px;
    }
    .stat-label { color: #7d8590; }
    .stat-value { color: #e6edf3; font-weight: 500; font-family: 'SF Mono', 'Fira Mono', monospace; }
    .card-result-warning {
      margin: 0 14px 10px;
      background: rgba(210,153,34,0.08); border: 1px solid rgba(210,153,34,0.25);
      border-radius: 6px; padding: 9px 12px;
      font-size: 11px; color: #e3b341; line-height: 1.6;
    }
    .load-all-btn {
      display: inline-block; margin-top: 7px;
      background: #21262d; border: 1px solid #30363d;
      border-radius: 6px; padding: 5px 12px;
      font-size: 11px; color: #c9d1d9; cursor: pointer;
      font-family: inherit; transition: border-color 0.15s, color 0.15s;
    }
    .load-all-btn:hover:not(:disabled) { border-color: #58a6ff; color: #58a6ff; }
    .load-all-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .card-result-status {
      padding: 0 14px 8px;
      font-size: 11px; color: #388bfd;
    }

    /* Collapsible WFS details */
    .wfs-toggle {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px; border-top: 1px solid #21262d;
      font-size: 11px; color: #484f58;
      cursor: pointer; user-select: none; transition: color 0.15s;
    }
    .wfs-toggle:hover { color: #7d8590; }
    .wfs-arrow { font-size: 8px; transition: transform 0.15s; }
    .wfs-toggle.open .wfs-arrow { transform: rotate(90deg); }
    .wfs-body { display: none; padding: 0 14px 12px; }
    .wfs-body.open { display: block; }
    pre.wfs-pre {
      background: #0d1117; border: 1px solid #21262d;
      border-radius: 6px; padding: 10px;
      font-size: 10px; color: #7d8590;
      white-space: pre-wrap; word-break: break-all;
      line-height: 1.6; overflow-x: auto;
    }

    /* Welcome card */
    .card-welcome {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; padding: 16px;
    }
    .card-welcome h3 {
      font-size: 13px; font-weight: 700; color: #f0f6fc; margin-bottom: 6px;
    }
    .card-welcome p {
      font-size: 12px; color: #7d8590; line-height: 1.65; margin-bottom: 14px;
    }
    .examples-label {
      font-size: 10px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.6px; color: #484f58; margin-bottom: 8px;
    }
    .example-btn {
      display: block; width: 100%; text-align: left;
      background: #161b22; border: 1px solid #30363d;
      border-radius: 7px; padding: 8px 12px;
      font-size: 12px; color: #58a6ff; cursor: pointer;
      font-family: inherit; margin-bottom: 6px;
      transition: border-color 0.15s, background 0.15s;
      line-height: 1.4;
    }
    .example-btn:last-child { margin-bottom: 0; }
    .example-btn:hover { background: #21262d; border-color: #58a6ff; }

    /* NGR layer card */
    .card-layers {
      background: #21262d; border: 1px solid #30363d;
      border-radius: 10px; overflow: hidden;
    }
    .layers-header {
      padding: 10px 14px; border-bottom: 1px solid #21262d;
      display: flex; align-items: center; gap: 7px;
      font-size: 12px; font-weight: 600; color: #f0f6fc;
    }
    .layers-source { margin-left: auto; font-size: 10px; color: #484f58; font-weight: 400; }
    .layer-row {
      padding: 9px 14px; border-bottom: 1px solid #21262d;
      display: flex; align-items: flex-start; gap: 10px;
    }
    .layer-row:last-child { border-bottom: none; }
    .layer-row-info { flex: 1; min-width: 0; }
    .layer-row-title {
      font-size: 12px; color: #e6edf3; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .layer-row-abstract {
      font-size: 10px; color: #7d8590; margin-top: 2px; line-height: 1.5;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .layer-add-btn {
      flex-shrink: 0; background: #161b22; border: 1px solid #30363d;
      border-radius: 6px; padding: 4px 11px;
      font-size: 11px; color: #7d8590; cursor: pointer;
      font-family: inherit; white-space: nowrap; transition: all 0.15s;
    }
    .layer-add-btn:hover { border-color: #58a6ff; color: #58a6ff; }
    .layer-add-btn.active { background: #1f4f8e; border-color: #58a6ff; color: #79c0ff; }

    /* ─── Map overlays ─── */

    /* Draw tools */
    #map-tools {
      position: absolute; top: 16px; left: 16px; z-index: 10;
      display: flex; flex-direction: column; gap: 6px;
    }
    .map-tool-btn {
      width: 36px; height: 36px;
      background: rgba(22,27,34,0.96); border: 1px solid #30363d;
      border-radius: 8px; color: #7d8590; font-size: 17px;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      transition: all 0.15s; user-select: none;
    }
    .map-tool-btn:hover { border-color: #58a6ff; color: #58a6ff; }
    .map-tool-btn.active {
      background: rgba(31,79,142,0.9); border-color: #388bfd; color: #79c0ff;
    }
    .map-tool-btn.pulse {
      animation: btn-pulse 1.4s ease-in-out infinite;
    }
    @keyframes btn-pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(56,139,253,0.6), 0 2px 8px rgba(0,0,0,0.5); }
      50% { box-shadow: 0 0 0 6px rgba(56,139,253,0), 0 2px 8px rgba(0,0,0,0.5); }
    }

    /* Location search */
    #location-search {
      position: absolute; top: 16px; left: 62px; z-index: 10;
      width: 210px;
    }
    #location-input {
      width: 100%; background: rgba(22,27,34,0.96); border: 1px solid #30363d;
      border-radius: 8px; padding: 8px 12px;
      font-size: 12px; color: #e6edf3; outline: none; font-family: inherit;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5); transition: border-color 0.15s;
    }
    #location-input::placeholder { color: #484f58; }
    #location-input:focus { border-color: #388bfd; }
    .loc-dropdown {
      margin-top: 4px; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      display: none;
    }
    .loc-dropdown.open { display: block; }
    .loc-item {
      padding: 8px 12px; font-size: 12px; color: #e6edf3;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: background 0.1s;
    }
    .loc-item:hover { background: #21262d; }
    .loc-type {
      font-size: 10px; color: #484f58; margin-left: 8px; flex-shrink: 0;
    }

    /* Area info badge */
    #area-info {
      position: absolute; top: 58px; left: 62px; z-index: 10;
      background: rgba(22,27,34,0.96); border: 1px solid #1f4f8e;
      border-radius: 8px; padding: 8px 14px;
      font-size: 12px; color: #79c0ff;
      display: none; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    #area-info.visible { display: flex; }
    .area-label { color: #484f58; font-size: 11px; }

    /* Map loading bar */
    #map-loading-bar {
      position: absolute; top: 0; left: 0; right: 380px; height: 2px; z-index: 20;
      pointer-events: none; overflow: hidden;
    }
    #map-loading-bar.active::after {
      content: '';
      position: absolute; top: 0; height: 100%; width: 45%;
      background: linear-gradient(90deg, transparent, #388bfd, transparent);
      animation: shimmer 1.2s ease-in-out infinite;
    }
    @keyframes shimmer { from { left: -45%; } to { left: 100%; } }

    /* Data reload indicator */
    #reload-indicator {
      position: absolute; bottom: 20px; left: 16px; z-index: 10;
      background: rgba(22,27,34,0.96); border: 1px solid #21262d;
      border-radius: 8px; padding: 8px 14px;
      font-size: 12px; color: #7d8590;
      display: none; align-items: center; gap: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    #reload-indicator.visible { display: flex; }
    .reload-dot {
      width: 7px; height: 7px; border-radius: 50%; background: #388bfd; flex-shrink: 0;
      animation: blink 1s ease-in-out infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
    #reload-sub { font-size: 10px; color: #484f58; display: block; margin-top: 1px; }

    /* Active WMS chips */
    #wms-panel {
      position: absolute; bottom: 20px; right: 396px; z-index: 10;
      display: flex; flex-direction: column; gap: 5px; align-items: flex-end;
    }
    .wms-chip {
      background: rgba(22,27,34,0.96); border: 1px solid #21262d;
      border-radius: 6px; padding: 5px 10px;
      font-size: 11px; color: #7d8590;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
    }
    .wms-chip-title { color: #e6edf3; }
    .wms-chip-remove {
      background: none; border: none; color: #484f58;
      font-size: 14px; line-height: 1; cursor: pointer; padding: 0;
      transition: color 0.15s;
    }
    .wms-chip-remove:hover { color: #f85149; }

    /* Legend */
    #legend {
      position: absolute; bottom: 20px;
      left: calc(50% - 190px); /* centered in map area (full width - 380px panel) */
      background: rgba(22,27,34,0.96); border: 1px solid #21262d;
      border-radius: 8px; padding: 10px 16px; z-index: 10;
      display: none; min-width: 200px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }
    #legend.visible { display: block; }
    .legend-title { font-size: 10px; color: #7d8590; margin-bottom: 6px; }
    .legend-bar { height: 8px; border-radius: 4px; margin-bottom: 5px; }
    .legend-labels { display: flex; justify-content: space-between; font-size: 10px; color: #484f58; }

    /* Mobile */
    @media (max-width: 700px) {
      #panel { top: auto; left: 0; right: 0; bottom: 0; width: 100%; height: 52vh; border-left: none; border-top: 1px solid #21262d; }
      #map-loading-bar { right: 0; }
      #legend { left: 50%; transform: translateX(-50%); bottom: calc(52vh + 12px); }
      #reload-indicator { bottom: calc(52vh + 10px); }
      #wms-panel { right: 8px; bottom: calc(52vh + 10px); }
      #location-search { width: calc(100vw - 78px); }
      #area-info { top: 58px; left: 62px; }
    }
  </style>
</head>
<body>

  <div id="container"></div>
  <div id="map-loading-bar"></div>

  <div id="map-tools">
    <button class="map-tool-btn" id="draw-btn" title="Teken studiegebied" onclick="toggleDrawMode()">⬚</button>
    <button class="map-tool-btn" id="clear-btn" title="Verwijder selectie" onclick="clearDrawnArea()" style="display:none">✕</button>
  </div>

  <div id="location-search">
    <input id="location-input" type="text" placeholder="Zoek gemeente, wijk..." autocomplete="off" />
    <div id="location-dropdown" class="loc-dropdown"></div>
  </div>

  <div id="area-info">
    <span class="area-label">Gebied</span>
    <span id="area-desc">—</span>
  </div>

  <div id="reload-indicator">
    <div class="reload-dot"></div>
    <div>
      <span id="reload-text">Data laden...</span>
      <span id="reload-sub"></span>
    </div>
  </div>

  <div id="wms-panel"></div>

  <div id="legend">
    <div class="legend-title" id="legend-title"></div>
    <div class="legend-bar" id="legend-bar"></div>
    <div class="legend-labels">
      <span id="legend-min"></span>
      <span id="legend-max"></span>
    </div>
  </div>

  <!-- Side panel -->
  <div id="panel">
    <div class="panel-header">
      <h1>PDOK Verkenner</h1>
      <p>CBS · BAG · NGR — live geodata voor Nederland</p>
      <div class="steps-row">
        <div class="step-pill" id="step-1"></div>
        <div class="step-pill" id="step-2"></div>
        <div class="step-pill" id="step-3"></div>
      </div>
    </div>

    <div id="messages">
      <div class="card-welcome">
        <h3>Verken Nederland in data</h3>
        <p>Stel een vraag, de AI kiest de juiste databron. Je tekent daarna het studiegebied op de kaart — dan wordt de data voor precies dat gebied opgehaald.</p>
        <div class="examples-label">Voorbeelden</div>
        <button class="example-btn" onclick="useExample(this)">Waar wonen de meeste mensen per 100m²?</button>
        <button class="example-btn" onclick="useExample(this)">Toon de gemiddelde WOZ-waarde van woningen</button>
        <button class="example-btn" onclick="useExample(this)">Welke gebieden hebben veel sociale huurwoningen?</button>
        <button class="example-btn" onclick="useExample(this)">Toon gebouwen gebouwd vóór 1945</button>
        <button class="example-btn" onclick="useExample(this)">Afstand tot dichtstbijzijnde supermarkt</button>
      </div>
    </div>

    <div id="input-area">
      <div class="input-row">
        <input id="question-input" type="text"
          placeholder="Stel een vraag over Nederland..." autocomplete="off" />
        <button id="submit-btn" title="Verstuur">→</button>
      </div>
    </div>
  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────
    // Color scales
    // ─────────────────────────────────────────────────────────────────
    const SCALES = {
      'blue-orange': [[26,107,189],[77,166,255],[255,224,102],[255,140,66],[217,48,48]],
      'green-red':   [[0,180,80],[160,230,80],[255,224,102],[255,140,66],[200,40,40]],
      'blue-green':  [[26,58,90],[26,107,130],[26,140,100],[80,180,80],[160,230,80]],
      'sequential':  [[8,30,90],[26,107,189],[77,166,255],[160,210,255],[220,240,255]],
    };

    function interpolateColor(value, min, max, colors) {
      if (value == null || isNaN(value)) return [40, 40, 60, 0];
      const range = max > min ? max - min : 1;
      const t  = Math.max(0, Math.min(1, (value - min) / range));
      const n  = colors.length - 1;
      const i  = Math.floor(t * n);
      const f  = t * n - i;
      const c0 = colors[Math.min(i, n)];
      const c1 = colors[Math.min(i + 1, n)];
      return [
        Math.round(c0[0] + f * (c1[0] - c0[0])),
        Math.round(c0[1] + f * (c1[1] - c0[1])),
        Math.round(c0[2] + f * (c1[2] - c0[2])),
        210,
      ];
    }

    function gradientCss(colorScale) {
      const stops = SCALES[colorScale] || SCALES['sequential'];
      const pct = stops.map((c, i) => `rgb(${c.join(',')}) ${Math.round(i / (stops.length - 1) * 100)}%`);
      return `linear-gradient(to right, ${pct.join(', ')})`;
    }

    // ─────────────────────────────────────────────────────────────────
    // Coordinate conversion — RD New (EPSG:28992) → WGS84
    // ─────────────────────────────────────────────────────────────────
    function rdNewToWgs84(rdX, rdY) {
      const p = (rdX - 155000) / 100000;
      const q = (rdY - 463000) / 100000;
      const dLat =  3235.65389 * q
                  -   32.58297 * p * p
                  -    0.24750 * q * q * q
                  -    0.84978 * p * p * q
                  -    0.06550 * q * q
                  -    0.01709 * p * p * q * q
                  -    0.00738 * p
                  +    0.00530 * p * p * p * q
                  -    0.00039 * p * q * q;
      const dLon =  5260.52916 * p
                  +  105.94684 * p * q
                  +    2.45656 * q * q
                  -    0.81885 * p * p * p
                  +    0.05594 * p * q * q
                  -    0.05607 * p * p * p * q
                  +    0.01199 * q
                  -    0.00256 * p * p * p * q * q
                  +    0.00128 * p * q * q * q
                  +    0.00022 * q * q
                  -    0.00022 * p * p;
      return { lat: 52.15517440 + dLat / 3600, lon: 5.38720621 + dLon / 3600 };
    }

    function toLatLon(x, y) {
      if (Math.abs(x) > 100 || Math.abs(y) > 100) return rdNewToWgs84(x, y);
      if (x >= 48 && x <= 56) return { lat: x, lon: y };   // EPSG:4326 lat/lon order
      return { lat: y, lon: x };                             // GeoJSON [lon, lat]
    }

    // ─────────────────────────────────────────────────────────────────
    // H3 binning
    // ─────────────────────────────────────────────────────────────────
    function flattenFirstRing(geom) {
      if (geom.type === 'Point')        return [geom.coordinates];
      if (geom.type === 'MultiPoint')   return geom.coordinates;
      if (geom.type === 'Polygon')      return geom.coordinates[0];
      if (geom.type === 'MultiPolygon') return geom.coordinates[0][0];
      if (geom.type === 'LineString')   return geom.coordinates;
      return [];
    }

    function centroid(geom) {
      const pts = flattenFirstRing(geom);
      if (!pts.length) return null;
      const x = pts.reduce((s, p) => s + p[0], 0) / pts.length;
      const y = pts.reduce((s, p) => s + p[1], 0) / pts.length;
      return toLatLon(x, y);
    }

    const CBS_SUPPRESSED = -9000; // CBS uses -99997/-99998/-99999 for missing/suppressed

    function binFeaturesToH3(features, metricProp, aggregation, resolution) {
      const cells = new Map();

      for (const f of features) {
        if (!f.geometry) continue;
        const c = centroid(f.geometry);
        if (!c) continue;

        let h3id;
        try { h3id = h3.geoToH3(c.lat, c.lon, resolution); } catch { continue; }

        const raw = f.properties?.[metricProp];
        const num = raw != null ? Number(raw) : NaN;
        const val = (!isNaN(num) && num > CBS_SUPPRESSED) ? num : NaN;

        if (!cells.has(h3id)) cells.set(h3id, { sum: 0, count: 0, max: -Infinity, validCount: 0 });
        const cell = cells.get(h3id);
        cell.count++;
        if (!isNaN(val)) {
          cell.sum  += val;
          cell.max   = Math.max(cell.max, val);
          cell.validCount++;
        }
      }

      const data = [];
      for (const [h3id, cell] of cells) {
        let value;
        if      (aggregation === 'count') value = cell.count;
        else if (aggregation === 'sum')   value = cell.validCount > 0 ? cell.sum : NaN;
        else if (aggregation === 'avg')   value = cell.validCount > 0 ? cell.sum / cell.validCount : NaN;
        else if (aggregation === 'max')   value = cell.max === -Infinity ? NaN : cell.max;
        else                              value = cell.validCount > 0 ? cell.sum / cell.validCount : NaN;
        if (!isNaN(value)) data.push({ h3id, value });
      }

      const vals = data.map(d => d.value).filter(v => isFinite(v));
      return {
        data,
        min: vals.length ? Math.min(...vals) : 0,
        max: vals.length ? Math.max(...vals) : 0,
        hexCount: data.length,
        validValues: vals.length,
      };
    }

    // ─────────────────────────────────────────────────────────────────
    // App state
    // ─────────────────────────────────────────────────────────────────
    const PAGE_SIZE = 1000;

    let deckInstance       = null;
    let currentViewState   = null;
    let currentQuery       = null;   // AI response; set after askAI succeeds
    let currentH3Data      = null;
    let currentMetric      = null;
    let currentColorScale  = 'sequential';
    let currentBbox        = null;
    let currentRawFeatures = [];
    let busy               = false;
    let paging             = false;
    let activeCardEl       = null;
    let drawCardEl         = null;   // the "draw your area" prompt card

    // Draw state
    let drawMode    = false;
    let drawStart   = null;
    let drawnBbox   = null;
    let drawPreview = null;

    // WMS overlay
    const wmsLayers = new Map();
    const _ngrData  = {};

    // ─────────────────────────────────────────────────────────────────
    // Deck.gl setup
    // ─────────────────────────────────────────────────────────────────
    function initDeck() {
      currentViewState = { longitude: 5.2, latitude: 52.2, zoom: 7, pitch: 0, bearing: 0 };

      deckInstance = new deck.DeckGL({
        container: 'container',
        initialViewState: currentViewState,
        layers: [DeckGLUtils.createBasemap('voyager')],
        controller: true,
        onViewStateChange: ({ viewState }) => { currentViewState = viewState; },
        getTooltip: ({ object }) => {
          if (!object) return null;
          return {
            html: `<div style="font-size:12px;padding:4px 8px;">${formatValue(object.value)} <span style="color:#7d8590">${esc(currentMetric || '')}</span></div>`,
            style: { background: 'rgba(13,17,23,0.95)', border: '1px solid #30363d', borderRadius: '6px', color: '#e6edf3' },
          };
        },
      });

      const container = document.getElementById('container');

      container.addEventListener('mousedown', e => {
        if (!drawMode) return;
        e.stopPropagation();
        drawStart   = pixelToLatLon(e.clientX, e.clientY);
        drawPreview = { start: drawStart, end: drawStart };
        deckInstance.setProps({ controller: false });
      });

      container.addEventListener('mousemove', e => {
        if (!drawMode || !drawStart) return;
        drawPreview = { start: drawStart, end: pixelToLatLon(e.clientX, e.clientY) };
        updateMap();
      });

      container.addEventListener('mouseup', e => {
        if (!drawMode || !drawStart) return;
        const end = pixelToLatLon(e.clientX, e.clientY);
        drawnBbox  = normBbox(drawStart, end);
        drawStart  = null; drawPreview = null; drawMode = false;
        deckInstance.setProps({ controller: true });
        container.style.cursor = '';
        document.getElementById('draw-btn').classList.remove('active', 'pulse');
        document.getElementById('clear-btn').style.display = '';
        updateAreaInfo();
        updateMap();
        // Remove the "draw your area" prompt card if present
        if (drawCardEl) { drawCardEl.remove(); drawCardEl = null; }
        // If AI already responded, fetch data now
        if (currentQuery) fetchDataForBbox(drawnBbox);
      });
    }

    // ─────────────────────────────────────────────────────────────────
    // Coordinate helpers
    // ─────────────────────────────────────────────────────────────────
    function pixelToLatLon(cx, cy) {
      if (!currentViewState) return { lat: 0, lon: 0 };
      const { longitude, latitude, zoom } = currentViewState;
      const metersPerPx = 156543.03392 * Math.cos(latitude * Math.PI / 180) / Math.pow(2, zoom);
      const dx = (cx - window.innerWidth  / 2) * metersPerPx;
      const dy = (cy - window.innerHeight / 2) * metersPerPx;
      return {
        lon: longitude + dx / (111319.9 * Math.cos(latitude * Math.PI / 180)),
        lat: latitude  - dy / 110574,
      };
    }

    function normBbox(a, b) {
      return [
        Math.min(a.lon, b.lon), Math.min(a.lat, b.lat),
        Math.max(a.lon, b.lon), Math.max(a.lat, b.lat),
      ];
    }

    function getViewportBbox() {
      if (!currentViewState) return null;
      const { longitude, latitude, zoom } = currentViewState;
      const metersPerPx = 156543.03392 * Math.cos(latitude * Math.PI / 180) / Math.pow(2, zoom);
      const dLon = (metersPerPx * (window.innerWidth - 380) / 2) / (111319.9 * Math.cos(latitude * Math.PI / 180));
      const dLat = (metersPerPx * window.innerHeight / 2) / 110574;
      return [longitude - dLon, latitude - dLat, longitude + dLon, latitude + dLat];
    }

    // ─────────────────────────────────────────────────────────────────
    // Draw mode controls
    // ─────────────────────────────────────────────────────────────────
    function toggleDrawMode() {
      drawMode = !drawMode;
      document.getElementById('container').style.cursor = drawMode ? 'crosshair' : '';
      const btn = document.getElementById('draw-btn');
      btn.classList.toggle('active', drawMode);
      btn.classList.toggle('pulse', drawMode);
      if (!drawMode) { drawStart = null; drawPreview = null; updateMap(); }
    }
    window.toggleDrawMode = toggleDrawMode;

    function clearDrawnArea() {
      drawnBbox = null; drawPreview = null; drawStart = null;
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('area-info').classList.remove('visible');
      currentH3Data = null;
      updateMap();
      document.getElementById('legend').classList.remove('visible');
    }
    window.clearDrawnArea = clearDrawnArea;

    function updateAreaInfo() {
      if (!drawnBbox) return;
      const [w, s, e, n] = drawnBbox;
      const kmW = Math.round(Math.abs(e - w) * 111.32 * Math.cos((s + n) / 2 * Math.PI / 180));
      const kmH = Math.round(Math.abs(n - s) * 110.574);
      document.getElementById('area-desc').textContent = `${kmW} × ${kmH} km`;
      document.getElementById('area-info').classList.add('visible');
    }

    // ─────────────────────────────────────────────────────────────────
    // Layer building
    // ─────────────────────────────────────────────────────────────────
    function buildH3Layer(h3data, colorScale, min, max) {
      if (!h3data.length) return null;
      const colors = SCALES[colorScale] || SCALES['sequential'];
      // If all values equal, shift max by 1 so interpolation still assigns the top color
      const effectiveMax = max > min ? max : min + 1;

      updateLegend(colorScale, min, max);

      return new deck.H3HexagonLayer({
        id: 'h3-layer',
        data: h3data,
        getHexagon:   d => d.h3id,
        getFillColor: d => interpolateColor(d.value, min, effectiveMax, colors),
        getElevation: d => {
          if (d.value == null || isNaN(d.value)) return 0;
          return Math.max(0, (d.value - min) / (effectiveMax - min)) * 250;
        },
        extruded: true, elevationScale: 1,
        pickable: true,
        updateTriggers: { getFillColor: [min, effectiveMax, colorScale] },
      });
    }

    function buildDrawLayer() {
      const bbox = drawPreview ? normBbox(drawPreview.start, drawPreview.end) : drawnBbox;
      if (!bbox) return null;
      const [w, s, e, n] = bbox;
      const isDraft = !!drawPreview;
      return new deck.PolygonLayer({
        id: 'draw-layer',
        data: [{ polygon: [[w, s], [w, n], [e, n], [e, s], [w, s]] }],
        getPolygon:   d => d.polygon,
        filled: true, stroked: true,
        getFillColor:  [56, 139, 253, isDraft ? 18 : 28],
        getLineColor:  [56, 139, 253, isDraft ? 160 : 220],
        getLineWidth: 2, lineWidthMinPixels: 2,
        pickable: false,
      });
    }

    function updateMap() {
      if (!deckInstance) return;
      const layers = [DeckGLUtils.createBasemap('voyager')];
      if (currentH3Data?.data?.length) {
        const l = buildH3Layer(currentH3Data.data, currentColorScale, currentH3Data.min, currentH3Data.max);
        if (l) layers.push(l);
      }
      wmsLayers.forEach((info, id) => layers.push(createWmsTileLayer(id, info.wmsUrl, info.layerName)));
      const drawLayer = buildDrawLayer();
      if (drawLayer) layers.push(drawLayer);
      deckInstance.setProps({ layers });
    }

    // ─────────────────────────────────────────────────────────────────
    // WMS tile layers
    // ─────────────────────────────────────────────────────────────────
    function tileBbox3857(x, y, z) {
      const R = 20037508.342789244;
      const n = Math.pow(2, z);
      return {
        west:  -R + (x / n) * 2 * R,       east:  -R + ((x + 1) / n) * 2 * R,
        north:  R - (y / n) * 2 * R,        south:  R - ((y + 1) / n) * 2 * R,
      };
    }

    function createWmsTileLayer(id, wmsUrl, layerName) {
      return new deck.TileLayer({
        id: `wms-${id}`, tileSize: 256, minZoom: 0, maxZoom: 19,
        getTileData: async ({ x, y, z }) => {
          const { west, south, east, north } = tileBbox3857(x, y, z);
          const params = new URLSearchParams({
            SERVICE: 'WMS', VERSION: '1.1.1', REQUEST: 'GetMap',
            LAYERS: layerName, STYLES: '',
            BBOX: `${west},${south},${east},${north}`,
            WIDTH: '256', HEIGHT: '256',
            SRS: 'EPSG:3857', FORMAT: 'image/png', TRANSPARENT: 'TRUE',
          });
          try {
            const r = await fetch(`/api/proxy?url=${encodeURIComponent(wmsUrl + '?' + params)}`);
            if (!r.ok) return null;
            const ct = r.headers.get('content-type') || '';
            if (!ct.startsWith('image/')) return null;
            return createImageBitmap(await r.blob());
          } catch { return null; }
        },
        renderSubLayers: props => {
          if (!props.data) return null;
          const { bbox: { west, south, east, north } } = props.tile;
          return new deck.BitmapLayer(props, { data: null, image: props.data, bounds: [west, south, east, north] });
        },
        pickable: false,
      });
    }

    function toggleNgrLayer(id) {
      const info = _ngrData[id];
      if (!info) return;
      const btn = document.querySelector(`#row-${id} .layer-add-btn`);
      if (wmsLayers.has(id)) {
        wmsLayers.delete(id);
        if (btn) { btn.textContent = 'Toon'; btn.classList.remove('active'); }
      } else {
        wmsLayers.set(id, info);
        if (btn) { btn.textContent = 'Verberg'; btn.classList.add('active'); }
      }
      updateMap(); updateWmsPanel();
    }
    window.toggleNgrLayer = toggleNgrLayer;

    function updateWmsPanel() {
      document.getElementById('wms-panel').innerHTML = [...wmsLayers.entries()].map(([id, info]) => `
        <div class="wms-chip">
          <span class="wms-chip-title">${esc(info.title.slice(0, 36))}</span>
          <button class="wms-chip-remove" onclick="removeNgrLayer('${id}')">×</button>
        </div>`).join('');
    }
    function removeNgrLayer(id) {
      wmsLayers.delete(id); updateMap(); updateWmsPanel();
    }
    window.removeNgrLayer = removeNgrLayer;

    // ─────────────────────────────────────────────────────────────────
    // Legend
    // ─────────────────────────────────────────────────────────────────
    function updateLegend(colorScale, min, max) {
      document.getElementById('legend-bar').style.background = gradientCss(colorScale);
      document.getElementById('legend-min').textContent = formatValue(min);
      document.getElementById('legend-max').textContent = formatValue(max);
      document.getElementById('legend-title').textContent = currentMetric || '';
      document.getElementById('legend').classList.add('visible');
    }

    function formatValue(v) {
      if (v == null || isNaN(v)) return '—';
      if (Math.abs(v) >= 1e6) return (v / 1e6).toFixed(1) + 'M';
      if (Math.abs(v) >= 1e3) return (v / 1e3).toFixed(1) + 'k';
      if (Math.abs(v) < 10)   return v.toFixed(2);
      return Math.round(v).toLocaleString('nl-NL');
    }

    function esc(s) {
      return String(s).replace(/[<>&"]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));
    }

    // ─────────────────────────────────────────────────────────────────
    // Step indicator
    // ─────────────────────────────────────────────────────────────────
    function setStep(n) {
      // n = 1 (asking AI), 2 (draw area), 3 (data loaded)
      ['step-1','step-2','step-3'].forEach((id, i) => {
        const el = document.getElementById(id);
        el.className = 'step-pill ' + (i + 1 < n ? 'done' : i + 1 === n ? 'active' : '');
      });
    }

    // ─────────────────────────────────────────────────────────────────
    // Location search + fly-to
    // ─────────────────────────────────────────────────────────────────
    const ZOOM_FOR_TYPE = { gemeente: 11, woonplaats: 12, wijk: 13, buurt: 14 };

    async function flyToLocationById(id) {
      try {
        const res = await fetch(`/api/suggest-location?id=${encodeURIComponent(id)}`);
        const { doc } = await res.json();
        if (!doc?.centroide_ll) return;
        const m = doc.centroide_ll.match(/POINT\(([^ ]+) ([^)]+)\)/);
        if (!m) return;
        deckInstance.setProps({
          initialViewState: {
            longitude: parseFloat(m[1]),
            latitude:  parseFloat(m[2]),
            zoom:      ZOOM_FOR_TYPE[doc.type] || 11,
            pitch: 0, bearing: 0,
            transitionDuration: 900,
            transitionInterpolator: new deck.FlyToInterpolator({ speed: 1.5 }),
          },
        });
      } catch {}
    }

    async function flyToLocationName(name) {
      try {
        const res = await fetch(`/api/suggest-location?q=${encodeURIComponent(name)}`);
        const { docs } = await res.json();
        if (docs?.length) await flyToLocationById(docs[0].id);
      } catch {}
    }

    // Autocomplete wiring
    let locDebounce = null;

    document.getElementById('location-input').addEventListener('input', e => {
      clearTimeout(locDebounce);
      const q = e.target.value.trim();
      if (q.length < 2) { closeLocDropdown(); return; }
      locDebounce = setTimeout(async () => {
        try {
          const res = await fetch(`/api/suggest-location?q=${encodeURIComponent(q)}`);
          const { docs } = await res.json();
          renderLocDropdown(docs || []);
        } catch {}
      }, 200);
    });

    document.getElementById('location-input').addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeLocDropdown(); e.target.blur(); }
    });

    document.addEventListener('click', e => {
      if (!document.getElementById('location-search').contains(e.target)) closeLocDropdown();
    });

    function renderLocDropdown(docs) {
      const dd = document.getElementById('location-dropdown');
      if (!docs.length) { closeLocDropdown(); return; }
      dd.innerHTML = docs.map(d => `
        <div class="loc-item" data-id="${esc(d.id)}" data-name="${esc(d.weergavenaam)}">
          <span>${esc(d.weergavenaam)}</span>
          <span class="loc-type">${esc(d.type)}</span>
        </div>`).join('');
      dd.classList.add('open');
      dd.querySelectorAll('.loc-item').forEach(el => {
        el.addEventListener('click', async () => {
          document.getElementById('location-input').value = el.dataset.name;
          closeLocDropdown();
          await flyToLocationById(el.dataset.id);
        });
      });
    }

    function closeLocDropdown() {
      const dd = document.getElementById('location-dropdown');
      dd.innerHTML = '';
      dd.classList.remove('open');
    }

    // ─────────────────────────────────────────────────────────────────
    // Core workflow
    // ─────────────────────────────────────────────────────────────────

    // Phase 1: send question to AI, get dataset selection
    async function askAI(question) {
      if (busy) return;
      busy = true; setBusy(true);
      setStep(1);

      appendMsg('user', question);

      // Show thinking card
      const thinkEl = createThinkCard();
      const think = thinkEl._ctrl;

      try {
        think.step('AI analyseert vraag en kiest databron...');

        const aiRes = await fetch('/api/ask-wfs', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question }),
        });
        const aiData = await aiRes.json();
        if (!aiRes.ok || aiData.error) throw new Error(aiData.error || 'AI fout');

        // Force H3 res 9 and avg aggregation for CBS
        aiData.h3Resolution = 9;
        if (aiData.wfsUrl.includes('vierkantstatistieken')) aiData.aggregation = 'avg';

        think.done();
        thinkEl.remove();

        currentQuery      = aiData;
        currentMetric     = aiData.metric_column;
        currentColorScale = aiData.color_scale || 'sequential';

        // Show AI analysis card
        appendAiCard(aiData);

        // Auto-fly to location if AI extracted one from the question
        if (aiData.location) {
          flyToLocationName(aiData.location);
          document.getElementById('location-input').value = aiData.location;
        }

        // Show "draw your area" prompt and activate draw mode
        setStep(2);
        drawCardEl = appendDrawPromptCard(aiData);
        activateDrawMode();

      } catch (err) {
        think.done();
        thinkEl.remove();
        appendMsg('error', `Fout: ${esc(err.message)}`);
        setStep(0);
      } finally {
        busy = false; setBusy(false);
      }
    }

    // Phase 2: user drew a bbox → fetch WFS data
    async function fetchDataForBbox(bbox) {
      if (!currentQuery || paging) return;
      setStep(3);
      setMapLoading(true);
      showReloadIndicator('Data ophalen via PDOK...');

      const { wfsUrl, typeName, cqlFilter, metric_column, aggregation } = currentQuery;

      try {
        const params = new URLSearchParams({ wfsUrl, typeName, bbox: bbox.join(',') });
        if (cqlFilter) params.set('cqlFilter', cqlFilter);

        const res = await fetch(`/api/wfs-proxy?${params}`);
        const data = await res.json();
        if (!res.ok || data.error) throw new Error(data.error || `WFS fout ${res.status}`);

        const features  = data.features || [];
        const truncated = res.headers.get('X-Truncated') === '1' || features.length >= PAGE_SIZE;

        currentBbox        = bbox;
        currentRawFeatures = features;
        currentH3Data      = binFeaturesToH3(features, metric_column, aggregation, 9);
        updateMap();

        // Replace or append result card
        if (activeCardEl) { activeCardEl.remove(); activeCardEl = null; }
        activeCardEl = appendResultCard(currentQuery, features, currentH3Data, truncated);

        if (currentQuery.ngr_keywords?.length) searchAndSuggestLayers(currentQuery.ngr_keywords);

      } catch (err) {
        appendMsg('error', `Fout: ${esc(err.message)}`);
      } finally {
        hideReloadIndicator();
        setMapLoading(false);
      }
    }

    // Paginate through all PDOK pages
    async function loadAllPages() {
      if (!currentQuery || paging) return;
      paging = true;
      const btn = document.querySelector('.load-all-btn');
      if (btn) btn.disabled = true;

      const { wfsUrl, typeName, cqlFilter, metric_column, aggregation } = currentQuery;
      const bbox = currentBbox;

      let allFeatures = [...currentRawFeatures];
      let startIndex  = allFeatures.length;
      let pageNum     = 2;
      let hasMore     = true;

      setMapLoading(true);

      try {
        while (hasMore) {
          showReloadIndicator(`Pagina ${pageNum} laden...`, `${allFeatures.length.toLocaleString('nl-NL')} features geladen`);
          const params = new URLSearchParams({ wfsUrl, typeName, bbox: bbox.join(','), startIndex });
          if (cqlFilter) params.set('cqlFilter', cqlFilter);

          const res = await fetch(`/api/wfs-proxy?${params}`);
          const data = await res.json();
          if (!res.ok || data.error) break;

          const page = data.features || [];
          allFeatures = [...allFeatures, ...page];
          if (page.length < PAGE_SIZE) { hasMore = false; }
          else { startIndex += PAGE_SIZE; pageNum++; }
        }

        currentRawFeatures = allFeatures;
        currentH3Data      = binFeaturesToH3(allFeatures, metric_column, aggregation, 9);
        updateMap();
        updateCardStatus(allFeatures.length, currentH3Data.hexCount, false);

      } finally {
        paging = false;
        setMapLoading(false);
        hideReloadIndicator();
      }
    }
    window.loadAllPages = loadAllPages;

    // ─────────────────────────────────────────────────────────────────
    // UI cards
    // ─────────────────────────────────────────────────────────────────
    function createThinkCard() {
      const el = document.createElement('div');
      el.className = 'card-thinking';
      document.getElementById('messages').appendChild(el);
      scrollToBottom();

      let activeStep = null;

      el._ctrl = {
        step(text) {
          if (activeStep) {
            activeStep.className = 'think-step done';
            activeStep.querySelector('.think-icon').className = 'think-icon';
            activeStep.querySelector('.think-icon').textContent = '✓';
          }
          activeStep = document.createElement('div');
          activeStep.className = 'think-step active';
          activeStep.innerHTML = `<span class="think-icon spin">↻</span><span>${esc(text)}</span>`;
          el.appendChild(activeStep);
          scrollToBottom();
        },
        done() {
          if (activeStep) {
            activeStep.className = 'think-step done';
            const icon = activeStep.querySelector('.think-icon');
            icon.className = 'think-icon';
            icon.textContent = '✓';
          }
        },
        remove() { el.remove(); },
      };
      return el;
    }

    function appendAiCard(aiData) {
      const source = aiData.wfsUrl.includes('vierkantstatistieken') ? 'CBS Vierkantstatistieken 100m' :
                     aiData.wfsUrl.includes('bag') ? 'BAG Gebouwen' : 'PDOK WFS';
      const year   = (aiData.wfsUrl.match(/\/(\d{4})\//) || [])[1] || '';
      const title  = aiData.title_nl || aiData.title_en || '';

      const el = document.createElement('div');
      el.className = 'card-ai';
      el.innerHTML = `
        <div class="card-ai-header">
          <div class="card-ai-title">${esc(title)}</div>
          ${aiData.reasoning ? `<div class="card-ai-reasoning">${esc(aiData.reasoning)}</div>` : ''}
        </div>
        <div class="card-ai-tags">
          <span class="tag blue">${esc(source)}${year ? ' · ' + year : ''}</span>
          <span class="tag">${esc(aiData.metric_column)}</span>
          <span class="tag">${esc(aiData.aggregation)}</span>
          ${aiData.cqlFilter ? `<span class="tag">filter: ${esc(aiData.cqlFilter)}</span>` : ''}
        </div>`;
      document.getElementById('messages').appendChild(el);
      scrollToBottom();
      return el;
    }

    function appendDrawPromptCard(aiData) {
      const el = document.createElement('div');
      el.className = 'card-draw-prompt';
      el.innerHTML = `
        <div class="dp-icon">⬚</div>
        <div class="dp-title">Teken nu je studiegebied</div>
        <div class="dp-desc">Klik en sleep op de kaart om het gebied te selecteren waarvoor je data wilt ophalen. PDOK geeft maximaal 1.000 features per aanvraag — een kleiner gebied geeft een vollediger beeld.</div>
        <div class="dp-hint">Tip: zoom in op je gewenste gebied vóórdat je tekent voor de beste datadichtheid.</div>`;
      document.getElementById('messages').appendChild(el);
      scrollToBottom();
      return el;
    }

    function activateDrawMode() {
      if (drawMode) return;
      drawMode = true;
      document.getElementById('container').style.cursor = 'crosshair';
      const btn = document.getElementById('draw-btn');
      btn.classList.add('active', 'pulse');
    }

    function appendResultCard(aiData, features, binResult, truncated) {
      const title        = aiData.title_nl || aiData.title_en || '';
      const source       = aiData.wfsUrl.includes('vierkantstatistieken') ? 'CBS Vierkantstatistieken 100m' :
                           aiData.wfsUrl.includes('bag') ? 'BAG Gebouwen' : 'PDOK WFS';
      const year         = (aiData.wfsUrl.match(/\/(\d{4})\//) || [])[1] || '';
      const featureCount = features.length;
      const hexCount     = binResult.hexCount;
      const [w, s, e, n] = currentBbox || [0, 0, 0, 0];
      const kmW = Math.round(Math.abs(e - w) * 111.32 * Math.cos((s + n) / 2 * Math.PI / 180));
      const kmH = Math.round(Math.abs(n - s) * 110.574);

      const isSuppressed = featureCount > 0 && hexCount === 0;

      const el = document.createElement('div');
      el.className = 'card-result';
      el.innerHTML = `
        <div class="card-result-header">
          <div class="card-result-title">${esc(title)}</div>
          <div class="card-result-subtitle">${esc(source)}${year ? ' · ' + year : ''}</div>
        </div>
        <div class="card-result-stats">
          <div class="stat-row">
            <span class="stat-label">Studiegebied</span>
            <span class="stat-value">${kmW} × ${kmH} km</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">CBS-cellen opgehaald</span>
            <span class="stat-value">${featureCount.toLocaleString('nl-NL')}</span>
          </div>
          <div class="stat-row">
            <span class="stat-label">Hexagonen met data</span>
            <span class="stat-value">${hexCount.toLocaleString('nl-NL')} (~174 m)</span>
          </div>
          ${hexCount > 0 && binResult.min != null && !isNaN(binResult.min) ? `
          <div class="stat-row">
            <span class="stat-label">Bereik (${esc(aiData.metric_column)})</span>
            <span class="stat-value">${formatValue(binResult.min)} – ${formatValue(binResult.max)}</span>
          </div>` : ''}
        </div>
        ${isSuppressed ? `
        <div class="card-result-warning" style="border-color:rgba(248,81,73,0.3);background:rgba(248,81,73,0.08);color:#f85149;">
          ✕ CBS heeft <b>${esc(aiData.metric_column)}</b> voor alle ${featureCount} cellen in dit gebied onderdrukt.<br><br>
          CBS publiceert gevoelige waarden (WOZ, gas, energie, inkomen) alleen als een cel voldoende bewoners heeft — anders krijg je code <b>−99995</b> tot <b>−99999</b>.<br><br>
          Probeer een ander kenmerk zoals <b>aantalInwoners</b>, <b>aantalWoningen</b> of <b>percentageKoopwoningen</b>, of kies een dichter bebouwd gebied.
        </div>` : ''}
        ${truncated && !isSuppressed ? `
        <div class="card-result-warning">
          ⚠ PDOK heeft de respons afgekapt op ${featureCount.toLocaleString('nl-NL')} features — het beeld is mogelijk onvolledig.
          <br><button class="load-all-btn" onclick="loadAllPages()">Alle pagina's ophalen</button>
        </div>` : ''}
        <div class="card-result-status"></div>
        <div class="wfs-toggle" onclick="this.classList.toggle('open');this.nextElementSibling.classList.toggle('open')">
          <span class="wfs-arrow">▶</span>
          <span>WFS query details</span>
        </div>
        <div class="wfs-body">
          <pre class="wfs-pre">${esc(buildWfsQueryString(aiData))}</pre>
        </div>`;

      el._statusEl = el.querySelector('.card-result-status');
      document.getElementById('messages').appendChild(el);
      scrollToBottom();
      return el;
    }

    function buildWfsQueryString(aiData) {
      const params = new URLSearchParams({
        wfsUrl: aiData.wfsUrl,
        typeName: aiData.typeName,
        bbox: currentBbox ? currentBbox.join(',') : '[bbox]',
      });
      if (aiData.cqlFilter) params.set('cqlFilter', aiData.cqlFilter);
      return `/api/wfs-proxy?${params}`;
    }

    function updateCardStatus(featureCount, hexCount, truncated) {
      if (!activeCardEl?._statusEl) return;
      activeCardEl._statusEl.textContent =
        `↻ ${featureCount.toLocaleString('nl-NL')} features → ${hexCount.toLocaleString('nl-NL')} hexagonen (alle pagina's geladen)`;
      const warn = activeCardEl.querySelector('.card-result-warning');
      if (warn) warn.style.display = truncated ? '' : 'none';
    }

    // ─────────────────────────────────────────────────────────────────
    // NGR layer suggestions
    // ─────────────────────────────────────────────────────────────────
    async function searchAndSuggestLayers(keywords) {
      for (const kw of keywords.slice(0, 2)) {
        try {
          const res = await fetch(`/api/search-wms?q=${encodeURIComponent(kw)}`);
          const { layers } = await res.json();
          if (layers?.length) { appendLayerSuggestionsCard(kw, layers); return; }
        } catch {}
      }
    }

    function appendLayerSuggestionsCard(keyword, layers) {
      const ts = Date.now();
      const rowsHtml = layers.map((l, i) => {
        const id = `ngr-${ts}-${i}`;
        _ngrData[id] = l;
        return `<div class="layer-row" id="row-${id}">
          <div class="layer-row-info">
            <div class="layer-row-title">${esc(l.title)}</div>
            ${l.abstract ? `<div class="layer-row-abstract">${esc(l.abstract)}</div>` : ''}
          </div>
          <button class="layer-add-btn" onclick="toggleNgrLayer('${id}')">Toon</button>
        </div>`;
      }).join('');

      const el = document.createElement('div');
      el.className = 'card-layers';
      el.innerHTML = `
        <div class="layers-header">
          <span>🗺</span>
          <span>Gerelateerde kaartlagen</span>
          <span class="layers-source">NGR · ${esc(keyword)}</span>
        </div>
        ${rowsHtml}`;
      document.getElementById('messages').appendChild(el);
      scrollToBottom();
    }

    // ─────────────────────────────────────────────────────────────────
    // DOM helpers
    // ─────────────────────────────────────────────────────────────────
    function appendMsg(type, text) {
      const el = document.createElement('div');
      el.className = type === 'user' ? 'msg-user' : 'msg-error';
      el.textContent = text;
      document.getElementById('messages').appendChild(el);
      scrollToBottom();
      return el;
    }

    function setBusy(val) {
      document.getElementById('submit-btn').disabled = val;
      document.getElementById('question-input').disabled = val;
    }

    function showReloadIndicator(text, sub) {
      document.getElementById('reload-text').textContent = text;
      document.getElementById('reload-sub').textContent  = sub || '';
      document.getElementById('reload-indicator').classList.add('visible');
    }

    function hideReloadIndicator() {
      document.getElementById('reload-indicator').classList.remove('visible');
    }

    function setMapLoading(on) {
      document.getElementById('map-loading-bar').classList.toggle('active', on);
    }

    function scrollToBottom() {
      const msgs = document.getElementById('messages');
      msgs.scrollTop = msgs.scrollHeight;
    }

    // ─────────────────────────────────────────────────────────────────
    // Input wiring
    // ─────────────────────────────────────────────────────────────────
    function submitQuestion() {
      const input = document.getElementById('question-input');
      const q = input.value.trim();
      if (!q) return;
      input.value = '';
      // Reset for a new question
      currentQuery = null; currentH3Data = null; currentBbox = null;
      currentRawFeatures = [];
      drawnBbox = null; drawMode = false;
      document.getElementById('draw-btn').classList.remove('active', 'pulse');
      document.getElementById('clear-btn').style.display = 'none';
      document.getElementById('area-info').classList.remove('visible');
      document.getElementById('legend').classList.remove('visible');
      document.getElementById('container').style.cursor = '';
      updateMap();
      askAI(q);
    }

    function useExample(btn) {
      document.getElementById('question-input').value = btn.textContent.trim();
      submitQuestion();
    }
    window.useExample = useExample;

    document.getElementById('submit-btn').addEventListener('click', submitQuestion);
    document.getElementById('question-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitQuestion();
    });

    // ─────────────────────────────────────────────────────────────────
    // Init
    // ─────────────────────────────────────────────────────────────────
    initDeck();
  </script>
</body>
</html>
