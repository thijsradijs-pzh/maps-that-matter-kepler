<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8' />
  <title>Ground Height Visualization – Maps That Matter</title>
  <meta name='viewport' content='initial-scale=1,maximum-scale=1,user-scalable=no' />
  <meta name="description" content="Ground height visualization for the Netherlands using the AHN elevation model, aggregated to H3 hexagons." />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://maps.mapsthatmatter.io/groundheight" />
  <meta property="og:title" content="Ground Height (AHN) — Maps That Matter" />
  <meta property="og:description" content="Ground height visualization for the Netherlands using the AHN elevation model, aggregated to H3 hexagons." />
  <meta property="og:image" content="https://maps.mapsthatmatter.io/assets/thijs.jpg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Ground Height (AHN)" />
  <meta name="twitter:description" content="Ground height visualization for the Netherlands using the AHN elevation model, aggregated to H3 hexagons." />
  <meta name="twitter:image" content="https://maps.mapsthatmatter.io/assets/thijs.jpg" />

   <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa-unGG15m6r6ufvAQNAPz3f.js"></script>
  <script>
    window.plausible = window.plausible || function () {
      (plausible.q = plausible.q || []).push(arguments)
    };
    plausible.init = plausible.init || function (i) { plausible.o = i || {} };
    plausible.init();
  </script>

  <!-- Dependencies -->
  <script src="https://unpkg.com/papaparse@5.4.1/papaparse.min.js"></script>
  <script src="https://unpkg.com/h3-js@3.7.2/dist/h3-js.umd.js"></script>
  <script src="https://unpkg.com/deck.gl@8.9.33/dist.min.js"></script>
  
  <!-- Shared utilities -->
  <script src="/shared/deckgl-utils.js"></script>
  
  <!-- Visualization config -->
  <script src="/groundheight/config.js"></script>
  
  <style>
    body { 
      margin: 0; 
      padding: 0; 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
    }
    
    #container { 
      width: 100vw;
      height: 100vh;
      position: relative;
      background: #0a0a0a;
    }

    #fullscreen-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* When in fullscreen, ensure wrapper takes full space */
    #fullscreen-wrapper:fullscreen,
    #fullscreen-wrapper:-webkit-full-screen,
    #fullscreen-wrapper:-moz-full-screen,
    #fullscreen-wrapper:-ms-fullscreen {
      width: 100vw;
      height: 100vh;
    }
    
    #controls {
      position: absolute;
      top: 20px;
      left: 20px;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.3);
      z-index: 1;
      max-width: 320px;
    }
    
    #controls h3 {
      margin: 0 0 15px 0;
      font-size: 16px;
      color: #333;
    }
    
    .control-group {
      margin: 15px 0;
    }
    
    .control-label {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }
    
    input[type="range"] {
      width: 100%;
      margin: 10px 0;
    }
    
    .value-display {
      font-size: 28px;
      font-weight: bold;
      color: #43A2CA;
      margin: 10px 0;
      text-align: center;
      transition: all 0.3s ease;
    }
    
    .value-display.updating {
      transform: scale(1.1);
      color: #7BCCC4;
    }
    
    .legend {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid #ddd;
    }
    
    .legend-title {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #666;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      margin: 5px 0;
      font-size: 11px;
    }
    
    .legend-color {
      width: 20px;
      height: 12px;
      margin-right: 8px;
      border-radius: 2px;
    }
    
    .stats {
      font-size: 12px;
      color: #333;
      margin-top: 15px;
      padding: 12px;
      background: #f8f8f8;
      border-radius: 4px;
      line-height: 1.8;
    }
    
    .stats strong {
      color: #666;
      font-weight: 600;
    }
    
    .stats span {
      color: #43A2CA;
      font-weight: bold;
    }
    
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 24px 40px;
      border-radius: 8px;
      font-size: 16px;
      z-index: 2;
      text-align: center;
    }
    .spinner {
      width: 32px; height: 32px;
      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #43A2CA;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 14px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    /* Fullscreen button */
    #fullscreen-btn {
      padding: 8px 16px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ddd;
      background: white;
      border-radius: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    
    #fullscreen-btn:hover {
      background: #f5f5f5;
      border-color: #43A2CA;
      color: #43A2CA;
    }
    
    #fullscreen-btn svg {
      width: 16px;
      height: 16px;
    }
    
    /* Fullscreen mode adjustments */
    .fullscreen #controls {
      top: 10px;
      left: 10px;
    }
    
    /* Button row styling */
    .button-row {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    
    .button-row button {
      flex: 1;
    }
  </style>
</head>
<body>
  <a href="/" style="position:fixed;top:12px;left:12px;z-index:9999;background:rgba(13,17,23,0.85);color:#58a6ff;font-size:11px;font-weight:600;padding:6px 10px;border-radius:6px;border:1px solid #30363d;text-decoration:none;backdrop-filter:blur(4px);">← Maps That Matter</a>
  <!-- Wrapper for fullscreen functionality -->
  <div id="fullscreen-wrapper">
    <div id="container"></div>
    
    <div id="loading"><div class="spinner"></div>Loading data...</div>
    <div id="controls" style="display:none;"></div>
  </div>

  <script>
    // Main application
    const {DeckGL} = deck;
    
    let deckInstance;
    let allData = [];
    let currentFilters = {};
    let viewState = null;
    let rotationFrameId = null;
    let isFullscreen = false;

    // Initialize filters from config
    if (VIZ_CONFIG.filters) {
      VIZ_CONFIG.filters.forEach(filter => {
        currentFilters[filter.key] = filter.default;
      });
    }

    // Fullscreen handling
    function toggleFullscreen() {
      if (!isFullscreen) {
        enterFullscreen();
      } else {
        exitFullscreen();
      }
    }

    function enterFullscreen() {
      const wrapper = document.getElementById('fullscreen-wrapper');
      if (wrapper.requestFullscreen) {
        wrapper.requestFullscreen();
      } else if (wrapper.webkitRequestFullscreen) {
        wrapper.webkitRequestFullscreen();
      } else if (wrapper.mozRequestFullScreen) {
        wrapper.mozRequestFullScreen();
      } else if (wrapper.msRequestFullscreen) {
        wrapper.msRequestFullscreen();
      }
    }

    function exitFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      } else if (document.mozCancelFullScreen) {
        document.mozCancelFullScreen();
      } else if (document.msExitFullscreen) {
        document.msExitFullscreen();
      }
    }

    // Listen for fullscreen changes
    document.addEventListener('fullscreenchange', updateFullscreenButton);
    document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
    document.addEventListener('mozfullscreenchange', updateFullscreenButton);
    document.addEventListener('MSFullscreenChange', updateFullscreenButton);

    function updateFullscreenButton() {
      isFullscreen = !!(document.fullscreenElement || document.webkitFullscreenElement || 
                        document.mozFullScreenElement || document.msFullscreenElement);
      
      const btn = document.getElementById('fullscreen-btn');
      if (btn) {
        btn.innerHTML = isFullscreen ? 
          `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> Exit Fullscreen` :
          `<svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg> Fullscreen`;
      }
      
      // Add/remove fullscreen class
      document.body.classList.toggle('fullscreen', isFullscreen);
    }

    // Build controls HTML from config
    function buildControls() {
      let html = `<h3>${VIZ_CONFIG.title}</h3>`;
      
      // Add filters
      if (VIZ_CONFIG.filters) {
        VIZ_CONFIG.filters.forEach(filter => {
          html += `
            <div class="control-group">
              <div class="value-display" id="${filter.key}-display">${filter.format ? filter.format(filter.default) : filter.default}</div>
              <input type="range" 
                     id="${filter.key}-slider" 
                     min="${filter.min}" 
                     max="${filter.max}" 
                     step="${filter.step}" 
                     value="${filter.default}">
              <div style="display: flex; justify-content: space-between; font-size: 11px; color: #666;">
                <span>${filter.min}</span>
                <span>${filter.max}</span>
              </div>
            </div>
          `;
        });
      }
      
      // Add legend
      if (VIZ_CONFIG.legend) {
        html += '<div class="legend">';
        VIZ_CONFIG.legend.forEach(section => {
          html += `<div class="legend-title">${section.title}</div>`;
          if (section.items) {
            section.items.forEach(item => {
              html += `
                <div class="legend-item">
                  <div class="legend-color" style="background: ${item.color};"></div>
                  <span>${item.label}</span>
                </div>
              `;
            });
          }
          if (section.description) {
            html += `<div style="font-size: 10px; color: #666; line-height: 1.4; margin-top: 5px;">${section.description}</div>`;
          }
        });
        html += '</div>';
      }
      
      // Add stats
      if (VIZ_CONFIG.stats) {
        html += '<div class="stats" id="stats"></div>';
      }

      // Button row with rotation and fullscreen
      html += `
        <div class="control-group button-row">
          <button id="toggle-rotation" style="padding: 6px 12px; font-size: 12px; cursor: pointer; border: 1px solid #ddd; background: white; border-radius: 4px;">
            ▶ Auto-rotate
          </button>
          <button id="fullscreen-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
            </svg>
            Fullscreen
          </button>
        </div>
      `;

      return html;
    }

    // Filter data based on current filters
    function filterData() {
      return allData.filter(d => {
        let passes = true;
        
        VIZ_CONFIG.filters?.forEach(filter => {
          const value = currentFilters[filter.key];
          passes = passes && filter.filterFn(d, value);
        });
        
        // Exclude empty if configured
        if (VIZ_CONFIG.excludeEmpty) {
          passes = passes && d[VIZ_CONFIG.excludeEmpty] > 0;
        }
        
        return passes;
      });
    }

    // Update statistics display
    function updateStats(filteredData) {
      if (!VIZ_CONFIG.stats) return;
      
      const statsEl = document.getElementById('stats');
      if (!statsEl) return;
      
      let html = '';
      VIZ_CONFIG.stats.forEach(stat => {
        const value = stat.calculate(filteredData);
        html += `<strong>${stat.label}:</strong> <span>${stat.format(value)}</span><br>`;
      });
      
      statsEl.innerHTML = html;
    }

    // Get layers for current state
    function getLayers() {
      const filteredData = filterData();
      updateStats(filteredData);
      
      const layers = [DeckGLUtils.createBasemap(VIZ_CONFIG.basemap || 'dark')];
      
      // Create visualization layer
      const layerConfig = VIZ_CONFIG.createLayer(filteredData, currentFilters);
      layers.push(DeckGLUtils.createH3Layer(layerConfig));
      
      return layers;
    }

    // Update visualization
    function updateVisualization() {
      if (deckInstance) {
        deckInstance.setProps({ layers: getLayers() });
      }
    }

    // Auto-rotation helpers
    function startAutoRotate() {
      if (!deckInstance || rotationFrameId) return;

      const rotate = () => {
        const bearing = (viewState?.bearing ?? 0) + 0.1; // degrees per frame
        viewState = {
          ...viewState,
          bearing
        };
        deckInstance.setProps({viewState});
        rotationFrameId = requestAnimationFrame(rotate);
      };

      rotationFrameId = requestAnimationFrame(rotate);
    }

    function stopAutoRotate() {
      if (!rotationFrameId) return;
      cancelAnimationFrame(rotationFrameId);
      rotationFrameId = null;
    }

    // Set up filter controls
    function setupControls() {
      // Slider behaviour
      VIZ_CONFIG.filters?.forEach(filter => {
        const slider = document.getElementById(`${filter.key}-slider`);
        const display = document.getElementById(`${filter.key}-display`);
        
        if (slider && display) {
          slider.addEventListener('input', (e) => {
            const value = filter.step === 1 ? parseInt(e.target.value) : parseFloat(e.target.value);
            currentFilters[filter.key] = value;
            
            display.classList.add('updating');
            display.textContent = filter.format ? filter.format(value) : value;
            setTimeout(() => display.classList.remove('updating'), 300);
            
            updateVisualization();
          });
        }
      });

      // Rotation button behaviour
      const rotationBtn = document.getElementById('toggle-rotation');
      if (rotationBtn) {
        rotationBtn.addEventListener('click', () => {
          if (rotationFrameId) {
            stopAutoRotate();
            rotationBtn.textContent = '▶ Auto-rotate';
          } else {
            startAutoRotate();
            rotationBtn.textContent = '⏸ Stop rotation';
          }
        });
      }

      // Fullscreen button behaviour
      const fullscreenBtn = document.getElementById('fullscreen-btn');
      if (fullscreenBtn) {
        if (!document.fullscreenEnabled && !document.webkitFullscreenEnabled) {
          fullscreenBtn.style.display = 'none';
        } else {
          fullscreenBtn.addEventListener('click', toggleFullscreen);
        }
      }
    }

    // Load data and initialize
    async function init() {
      try {
        
        // Load data
        allData = await DeckGLUtils.loadCSV(VIZ_CONFIG.dataUrl);
        
        // Verify H3 if needed
        if (VIZ_CONFIG.h3Field) {
          allData = allData.filter(d => d[VIZ_CONFIG.h3Field] && d[VIZ_CONFIG.h3Field].length > 0);
        }
        
        // Build and show controls
        document.getElementById('controls').innerHTML = buildControls();
        document.getElementById('controls').style.display = 'block';
        setupControls();
        
        // Initialize deck.gl
        viewState = {...VIZ_CONFIG.initialView};

        deckInstance = new DeckGL({
          container: 'container',
          initialViewState: VIZ_CONFIG.initialView,
          viewState,
          controller: true,
          layers: getLayers(),
          onViewStateChange: ({viewState: vs}) => {
            viewState = vs;
            deckInstance.setProps({viewState});
          },
          getTooltip: VIZ_CONFIG.tooltip ? ({object}) => {
            if (object) return VIZ_CONFIG.tooltip(object);
            return null;
          } : undefined
        });

        document.getElementById('loading').style.display = 'none';
      } catch (error) {
        console.error('❌ Error:', error);
        document.getElementById('loading').innerHTML = `<div style="font-size:18px;margin-bottom:10px;">⚠️ Kon data niet laden</div><div style="font-size:13px;color:#aaa;max-width:280px;line-height:1.5;">${error.message}</div><div style="font-size:11px;margin-top:12px;color:#777;">Ververs de pagina om opnieuw te proberen.</div>`;
      }
    }

    // Start when page loads
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
