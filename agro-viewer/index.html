<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AgroDataCube Deck.gl Viewer</title>
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #0b0c0d; }
        #container { width: 100vw; height: 100vh; }
        .stats-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(11, 12, 13, 0.85); color: #fff; padding: 15px;
            font-family: -apple-system, sans-serif; border-left: 4px solid #00f2ff;
            pointer-events: none; backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div class="stats-panel">
        <h3 style="margin:0">AgroDataCube Explorer</h3>
        <p id="status" style="font-size: 12px; color: #aaa;">Fetching parcels...</p>
    </div>

    <script>
        const { DeckGL, GeoJsonLayer } = deck;

        const INITIAL_VIEW_STATE = {
            longitude: 5.66,
            latitude: 51.97, // Centered near Wageningen
            zoom: 13,
            pitch: 45,
            bearing: 0
        };

        const deckInstance = new DeckGL({
            container: 'container',
            initialViewState: INITIAL_VIEW_STATE,
            controller: true,
            layers: []
        });

        // 1. Fetching logic that talks to your Vercel Proxy
        async function updateMap() {
            try {
                // Adjust bbox or remove query to use proxy's default
                const response = await fetch('/api/agro-proxy'); 
                const data = await response.json();

                const layer = new GeoJsonLayer({
                    id: 'agro-parcels',
                    data: data,
                    filled: true,
                    extruded: true,
                    getElevation: 5, // Slight 3D lift for visibility
                    getFillColor: f => {
                        // Logic for coloring by crop (example)
                        const code = f.properties.crop_code || 0;
                        return [30 + (code % 225), 180, 200, 200]; // Cyan-ish aesthetic
                    },
                    getLineColor: [0, 242, 255, 255],
                    getLineWidth: 1,
                    lineWidthUnits: 'pixels',
                    pickable: true,
                    autoHighlight: true,
                    highlightColor: [255, 255, 255, 100]
                });

                deckInstance.setProps({ layers: [layer] });
                document.getElementById('status').innerText = `${data.features.length} parcels loaded`;
            } catch (err) {
                document.getElementById('status').innerText = 'Error loading data';
                console.error(err);
            }
        }

        updateMap();
    </script>
</body>
</html>
