<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AgroDataCube Viewer</title>
    <script src="https://unpkg.com/react@16.14.0/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@16.14.0/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/redux@4.1.2/dist/redux.js"></script>
    <script src="https://unpkg.com/react-redux@7.2.6/dist/react-redux.min.js"></script>
    <script src="https://unpkg.com/styled-components@5.3.3/dist/styled-components.min.js"></script>
    <script src="https://unpkg.com/kepler.gl@2.5.5/dist/kepler-gl.js"></script>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #000; }
        #app { width: 100vw; height: 100vh; }
    </style>
</head>
<body>
    <div id="app"></div>
    <script>
        const { createStore, combineReducers, applyMiddleware, compose } = Redux;
        const { Provider, useDispatch } = ReactRedux;
        const KeplerGl = KeplerGl.KeplerGl;
        const { addDataToMap } = KeplerGl.actions;
        const { processGeojson } = KeplerGl.processors;

        // Setup Redux Store
        const reducers = combineReducers({ keplerGl: KeplerGl.keplerGlReducer });
        const store = createStore(reducers, {}, applyMiddleware(KeplerGl.taskMiddleware));

        function Map() {
            const dispatch = useDispatch();

            React.useEffect(() => {
                // Fetch data from your Vercel Proxy
                fetch('/api/agro-proxy')
                    .then(res => res.json())
                    .then(data => {
                        dispatch(addDataToMap({
                            datasets: [{
                                info: { label: 'AgroDataCube Fields', id: 'adc_fields' },
                                data: processGeojson(data)
                            }],
                            options: { centerMap: true }
                        }));
                    });
            }, [dispatch]);

            return React.createElement(KeplerGl, {
                id: "agro-map",
                width: window.innerWidth,
                height: window.innerHeight,
                mapboxApiAccessToken: "" // Leave empty for dark background
            });
        }

        ReactDOM.render(
            React.createElement(Provider, { store: store }, React.createElement(Map)),
            document.getElementById('app')
        );
    </script>
</body>
</html>
