<script src="https://cdn.jsdelivr.net/npm/force-graph@1.51.4/dist/force-graph.min.js"></script>

<style>
  :root { --bg:#050510; --fg:#d5d5e0; --muted:#778; --panel:#0b0b1a; --border:#2a2a45;
          --dataset:#5b8cff; --topic:#ff7cc3; --trefwoord:#3fbf9f; --accent:#a78bfa; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden }
  #graph { position:fixed; inset:0 }

  a.home-link { position:fixed; top:12px; left:12px; z-index:9999;
    background:rgba(5,5,20,0.85); color:var(--accent); font-size:11px; font-weight:600;
    padding:6px 10px; border-radius:6px; border:1px solid var(--border);
    text-decoration:none; backdrop-filter:blur(4px); }

  /* toolbar */
  #bar { position:fixed; top:12px; left:150px; right:12px; z-index:10; display:flex; gap:8px;
    align-items:center; flex-wrap:wrap;
    background:rgba(11,11,26,0.85); backdrop-filter:blur(8px); padding:8px 10px;
    border:1px solid var(--border); border-radius:10px }
  #bar input[type=text] { background:#0a0a16; border:1px solid var(--border); color:var(--fg);
    border-radius:6px; padding:5px 8px; width:200px; font-size:12px }
  #bar input[type=text]:focus { outline:1px solid var(--accent) }
  #bar button { background:#181828; border:1px solid var(--border); color:var(--fg);
    border-radius:6px; padding:5px 10px; cursor:pointer; font-size:12px }
  #bar button:hover { border-color:var(--dataset) }
  #bar button.active { border-color:var(--accent); background:#1e1a38; color:#c4b5fd }
  .chip { display:inline-flex; gap:6px; align-items:center; cursor:pointer; user-select:none;
    padding:4px 9px; border:1px solid var(--border); border-radius:20px; font-size:12px;
    background:transparent; color:var(--fg) }
  .chip .dot { width:10px; height:10px; border-radius:50% }
  .chip.off { opacity:.35 }
  #count { color:var(--muted); font-size:11px; margin-left:2px; white-space:nowrap }
  .sep { width:1px; height:20px; background:var(--border); flex-shrink:0; margin:0 2px }

  /* detail panel */
  #panel { position:fixed; top:0; right:0; height:100%; width:360px; max-width:85vw; z-index:11;
    background:var(--panel); border-left:1px solid var(--border); padding:20px; overflow-y:auto;
    transform:translateX(100%); transition:transform .25s ease }
  #panel.open { transform:none }
  #panel h2 { margin:0 20px 4px 0; font-size:17px; line-height:1.3; color:#fff }
  #panel .type { display:inline-block; font-size:11px; text-transform:uppercase; letter-spacing:.5px;
    padding:2px 8px; border-radius:12px; margin-bottom:12px }
  #panel .meta { color:var(--muted); font-size:12px; margin-bottom:14px }
  #panel .sam { white-space:pre-wrap; font-size:13px; color:#c2c2d2 }
  #panel .close { position:absolute; top:14px; right:16px; cursor:pointer; color:var(--muted);
    font-size:20px; border:none; background:none }
  #panel .portals { margin-top:10px; margin-bottom:16px; display:flex; flex-direction:column; gap:8px }
  #panel .portals a { display:flex; align-items:center; gap:10px; padding:11px 14px;
    border:1px solid var(--border); border-radius:8px; color:var(--fg); text-decoration:none;
    font-size:13px; font-weight:500; background:rgba(20,20,34,0.6); transition:border-color .15s,background .15s }
  #panel .portals a:hover { border-color:var(--dataset); background:#1e1e33 }
  #panel .portals a .icon { font-size:16px; flex-shrink:0 }
  #panel .portals a .pname { flex:1 }
  #panel .portals a .arrow { color:var(--muted); font-size:12px }
  #panel .nbr-section { margin-bottom:10px }
  #panel .nbr-head { font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin-bottom:5px; font-weight:600 }
  #panel .nbr-chips { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:2px }
  #panel .nbr-chip { font-size:12px; padding:3px 9px; border-radius:12px; border:1px solid var(--border);
    cursor:pointer; color:var(--fg); background:rgba(20,20,34,0.6); transition:border-color .12s,background .12s;
    max-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
  #panel .nbr-chip:hover { background:#26263a }
  #panel .nbr-more { font-size:12px; color:var(--muted); cursor:pointer; padding:2px 6px;
    border:none; background:none; border-radius:10px }
  #panel .nbr-more:hover { color:var(--fg); background:#26263a }

  #hint { position:fixed; bottom:12px; left:12px; z-index:10; color:#556; font-size:11px }

  #legenda { position:fixed; bottom:32px; left:12px; z-index:10; display:flex; flex-direction:column;
    gap:5px; background:rgba(11,11,26,0.85); backdrop-filter:blur(8px); padding:8px 12px;
    border:1px solid var(--border); border-radius:8px }
  #legenda .leg-item { display:flex; align-items:center; gap:8px; font-size:11px; color:var(--muted) }

  #search-wrap { position:relative }
  #search-results { position:absolute; top:100%; left:0; min-width:240px; background:#0d0d1e;
    border:1px solid var(--border); border-radius:8px; margin-top:4px; z-index:20;
    max-height:280px; overflow-y:auto; display:none; box-shadow:0 4px 16px rgba(0,0,0,0.5) }
  #search-results.open { display:block }
  #search-results .sr-item { padding:8px 10px; cursor:pointer; font-size:13px; display:flex; align-items:center; gap:8px }
  #search-results .sr-item:hover { background:#1c1c30 }
  #search-results .sr-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0 }
  #search-results .sr-label { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis }
  #search-results .sr-type { font-size:11px; color:var(--muted); flex-shrink:0 }

  /* ── Loading / error ── */
  #loading, #error {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    background:rgba(0,0,15,0.92); color:#ccd; padding:24px 36px; border-radius:8px;
    font-size:14px; z-index:30; text-align:center; min-width:240px;
  }
  .kg-spinner { width:30px; height:30px; border:3px solid rgba(167,139,250,0.15);
    border-top-color:var(--accent); border-radius:50%; animation:kg-spin 0.8s linear infinite;
    margin:0 auto 12px; }
  @keyframes kg-spin { to { transform:rotate(360deg); } }
  #error { display:none; color:#f0a; max-width:320px; }
  #error a { color:var(--accent); }

  @media (max-width: 640px) {
    #bar { left:12px; top:56px; }
    #legenda { display:none; }
  }
</style>
</head>
<body>

<a href="/" class="home-link">← Maps That Matter</a>

<div id="bar" style="display:none">
  <div id="search-wrap">
    <input id="search" type="text" placeholder="zoek dataset / topic / trefwoord…" aria-label="Zoek in kennisgraaf" />
    <div id="search-results"></div>
  </div>
  <span class="chip" data-type="dataset" role="button" tabindex="0" aria-label="Datasets tonen/verbergen"><span class="dot" style="background:var(--dataset)"></span>datasets</span>
  <span class="chip" data-type="topic" role="button" tabindex="0" aria-label="Topics tonen/verbergen"><span class="dot" style="background:var(--topic)"></span>topics</span>
  <span class="chip" data-type="trefwoord" role="button" tabindex="0" aria-label="Trefwoorden tonen/verbergen"><span class="dot" style="background:var(--trefwoord)"></span>trefwoorden</span>
  <span class="sep"></span>
  <button id="hier-topic" class="active" title="Topics als hub: datasets clusteren rondom topics">Topics centraal</button>
  <button id="hier-tref" title="Trefwoorden als hub: datasets clusteren rondom trefwoorden">Trefwoorden centraal</button>
  <button id="hier-vrij" title="Vrije layout: gelijke kracht voor alle knoopsoorten">Vrij</button>
  <span class="sep"></span>
  <button id="reset" aria-label="Graph centreren en passend zoomen">Fit</button>
  <span id="count"></span>
</div>

<div id="legenda" style="display:none">
  <div class="leg-item"><span class="dot" style="width:9px;height:9px;border-radius:50%;background:var(--dataset)"></span>dataset (cirkel)</div>
  <div class="leg-item"><span class="dot" style="width:9px;height:9px;background:var(--topic);clip-path:polygon(50% 0%,100% 25%,100% 75%,50% 100%,0% 75%,0% 25%)"></span>ISO-topic (zeshoek)</div>
  <div class="leg-item"><span class="dot" style="width:9px;height:9px;background:var(--trefwoord);transform:rotate(45deg)"></span>trefwoord (ruit)</div>
</div>

<div id="panel">
  <button class="close" id="closePanel" aria-label="Paneel sluiten">×</button>
  <span class="type" id="pType"></span>
  <h2 id="pTitle"></h2>
  <div class="meta" id="pMeta"></div>
  <div class="portals" id="pPortals"></div>
  <div class="sam" id="pSam"></div>
  <div class="links" id="pLinks"></div>
</div>

<div id="graph"></div>
<div id="hint" style="display:none">Klik = detail · sleep = vastzetten · scroll = zoom · dubbelklik achtergrond = fit</div>

<div id="loading"><div class="kg-spinner"></div>Kennisgraaf laden (5.824 datasets)…</div>
<div id="error">
  Kon de kennisgraaf niet laden.<br />
  <a href="javascript:location.reload()">Probeer opnieuw</a>
</div>

<script>
const DATA_URL = '/data/kennisgraaf_ngr.json';
const COLOR = { dataset:'#5b8cff', topic:'#ff7cc3', trefwoord:'#3fbf9f' };
const BG = '#050510';

let GRAPH, Graph, adj, nodeById;
const hidden = new Set();
let highlight = new Set(), highlightLinks = new Set(), selected = null;
let hierMode = 'topic';

async function init() {
  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    data = await res.json();
  } catch (err) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    console.error('Kennisgraaf data laden mislukt:', err);
    return;
  }
  GRAPH = data;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('bar').style.display = 'flex';
  document.getElementById('legenda').style.display = 'flex';
  document.getElementById('hint').style.display = 'block';
  buildGraph();
}

function buildGraph() {
  const el = document.getElementById('graph');

  adj = new Map();
  GRAPH.nodes.forEach(n => adj.set(n.id, new Set()));
  GRAPH.links.forEach(l => { adj.get(l.source)?.add(l.target); adj.get(l.target)?.add(l.source); });
  nodeById = new Map(GRAPH.nodes.map(n => [n.id, n]));

  function vr(n) {
    if (n.type === 'topic')     return 9;
    if (n.type === 'trefwoord') return Math.max(4, 1.5 + Math.sqrt(n.deg) * 0.6);
    return Math.max(3, 1 + Math.sqrt(n.deg) * 0.35);
  }

  function drawHexagon(ctx, x, y, r) {
    ctx.beginPath();
    for (let i = 0; i < 6; i++) {
      const a = (i * Math.PI) / 3 - Math.PI / 6;
      i === 0 ? ctx.moveTo(x + r * Math.cos(a), y + r * Math.sin(a))
               : ctx.lineTo(x + r * Math.cos(a), y + r * Math.sin(a));
    }
    ctx.closePath();
  }

  function drawDiamond(ctx, x, y, r) {
    ctx.beginPath();
    ctx.moveTo(x,       y - r);
    ctx.lineTo(x + r * 0.75, y);
    ctx.lineTo(x,       y + r);
    ctx.lineTo(x - r * 0.75, y);
    ctx.closePath();
  }

  function drawLabel(ctx, n, r, scale, dim) {
    const fs = n.type === 'topic' ? Math.max(11 / scale, 2.5) : Math.max(9 / scale, 2);
    ctx.font = `${n.type === 'topic' ? 'bold ' : ''}${fs}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    const t = n.label.length > 42 ? n.label.slice(0, 42) + '…' : n.label;
    const ypos = n.y + r + 2 / scale;
    ctx.strokeStyle = BG;
    ctx.lineWidth = Math.max(3 / scale, 0.6);
    ctx.strokeText(t, n.x, ypos);
    ctx.fillStyle = dim ? '#44445a' : (n.type === 'topic' ? '#ffe0f0' : '#d8d8e8');
    ctx.fillText(t, n.x, ypos);
  }

  Graph = ForceGraph()(el)
    .backgroundColor(BG)
    .graphData(GRAPH)
    .nodeVal(n => n.type === 'topic' ? 60 : n.type === 'trefwoord' ? Math.max(8, n.deg * 1.2) : Math.max(4, n.deg * 0.5))
    .nodeLabel(n => `${n.label} · ${n.type}`)
    .linkColor(l => highlightLinks.has(l) ? '#6a6a9c' : '#1e1e30')
    .linkWidth(l => highlightLinks.has(l) ? 1.6 : 0.5)
    .nodeCanvasObjectMode(() => 'replace')
    .nodeCanvasObject((n, ctx, scale) => {
      const base  = COLOR[n.type] || '#888';
      const dim   = highlight.size && !highlight.has(n.id);
      const active = selected === n;
      const fill  = dim ? '#272738' : base;
      const r     = vr(n);

      if (n.type === 'topic') {
        drawHexagon(ctx, n.x, n.y, r);
        ctx.fillStyle = fill;
        ctx.fill();
        ctx.strokeStyle = active ? '#ffffff' : (dim ? '#33334a' : '#ffffff55');
        ctx.lineWidth = active ? 2.5 / scale : 1.5 / scale;
        ctx.stroke();
      } else if (n.type === 'trefwoord') {
        drawDiamond(ctx, n.x, n.y, r);
        ctx.fillStyle = fill;
        ctx.fill();
        if (active) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 / scale; ctx.stroke(); }
      } else {
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
        ctx.fillStyle = fill;
        ctx.fill();
        if (active) { ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5 / scale; ctx.stroke(); }
      }

      const hubType = hierMode === 'tref' ? 'trefwoord' : hierMode === 'vrij' ? null : 'topic';
      const showLabel = n.type === hubType || highlight.has(n.id) || scale >= 2;
      if (showLabel) drawLabel(ctx, n, r, scale, dim);
    })
    .onNodeHover(n => { if (!selected) setHighlight(n); el.style.cursor = n ? 'pointer' : ''; })
    .onNodeClick(n => { selected = n; setHighlight(n); openPanel(n);
      Graph.centerAt(n.x, n.y, 500); Graph.zoom(Math.max(Graph.zoom(), 2.5), 500); })
    .onBackgroundClick(() => { selected = null; setHighlight(null); closePanel(); })
    .onNodeDragEnd(n => { n.fx = n.x; n.fy = n.y; })
    .cooldownTicks(200);

  setHierarchy('topic');

  document.getElementById('hier-topic').onclick = () => setHierarchy('topic');
  document.getElementById('hier-tref').onclick  = () => setHierarchy('tref');
  document.getElementById('hier-vrij').onclick  = () => setHierarchy('vrij');

  document.querySelectorAll('.chip').forEach(chip => {
    const toggle = () => {
      const t = chip.dataset.type;
      if (hidden.has(t)) { hidden.delete(t); chip.classList.remove('off'); }
      else { hidden.add(t); chip.classList.add('off'); }
      refresh();
    };
    chip.onclick = toggle;
    chip.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); } };
  });

  const searchEl  = document.getElementById('search');
  const resultsEl = document.getElementById('search-results');
  const MAX_RESULTS = 12;
  function closeSearch(){ resultsEl.classList.remove('open'); resultsEl.innerHTML = ''; }
  searchEl.addEventListener('input', e => {
    const q = e.target.value.trim().toLowerCase();
    closeSearch(); if (!q) return;
    const hits = Graph.graphData().nodes
      .filter(n => n.label.toLowerCase().includes(q))
      .slice(0, MAX_RESULTS);
    if (!hits.length) return;
    hits.forEach(hit => {
      const item = document.createElement('div'); item.className = 'sr-item';
      const dot  = document.createElement('span'); dot.className = 'sr-dot';
      dot.style.background = COLOR[hit.type] || '#888';
      const lbl  = document.createElement('span'); lbl.className = 'sr-label'; lbl.textContent = hit.label;
      const typ  = document.createElement('span'); typ.className = 'sr-type';  typ.textContent = hit.type;
      item.append(dot, lbl, typ);
      item.onclick = () => { searchEl.value = hit.label; closeSearch(); navigateTo(hit.id); };
      resultsEl.appendChild(item);
    });
    resultsEl.classList.add('open');
  });
  searchEl.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeSearch(); searchEl.blur(); } });
  document.addEventListener('click', e => { if (!e.target.closest('#search-wrap')) closeSearch(); });

  document.getElementById('reset').onclick = () => Graph.zoomToFit(500, 60);
  el.addEventListener('dblclick', e => { if (e.target.tagName === 'CANVAS') Graph.zoomToFit(500, 60); });

  addEventListener('resize', () => Graph.width(innerWidth).height(innerHeight));
  Graph.width(innerWidth).height(innerHeight);
  updateCount();
  setTimeout(() => Graph.zoomToFit(600, 60), 800);
}

function setHierarchy(mode) {
  hierMode = mode;
  document.querySelectorAll('#hier-topic,#hier-tref,#hier-vrij')
    .forEach(b => b.classList.remove('active'));
  document.getElementById('hier-' + mode).classList.add('active');

  if (mode === 'topic') {
    Graph.d3Force('charge').strength(n =>
      n.type === 'topic' ? -350 : n.type === 'trefwoord' ? -25 : -18);
    Graph.d3Force('link').distance(() => 45);
  } else if (mode === 'tref') {
    Graph.d3Force('charge').strength(n =>
      n.type === 'trefwoord' ? -280 : n.type === 'topic' ? -40 : -15);
    Graph.d3Force('link').distance(() => 40);
  } else {
    Graph.d3Force('charge').strength(-50);
    Graph.d3Force('link').distance(() => 30);
  }
  Graph.d3ReheatSimulation();
}

function visible() {
  const nodes = GRAPH.nodes.filter(n => !hidden.has(n.type));
  const ok = new Set(nodes.map(n => n.id));
  const links = GRAPH.links.filter(l =>
    ok.has(l.source.id ?? l.source) && ok.has(l.target.id ?? l.target));
  return { nodes, links };
}
function refresh() { Graph.graphData(visible()); updateCount(); }
function updateCount() {
  const d = Graph.graphData();
  document.getElementById('count').textContent = `${d.nodes.length} nodes · ${d.links.length} edges`;
}

function setHighlight(n) {
  highlight = new Set(); highlightLinks = new Set();
  if (n) {
    highlight.add(n.id); (adj.get(n.id)||[]).forEach(id => highlight.add(id));
    Graph.graphData().links.forEach(l => {
      const s = l.source.id ?? l.source, t = l.target.id ?? l.target;
      if (s === n.id || t === n.id) highlightLinks.add(l);
    });
  }
  Graph.nodeColor(nd => {
    const base = COLOR[nd.type] || '#888';
    if (!highlight.size) return base;
    return highlight.has(nd.id) ? (nd === selected ? '#ffffff' : base) : '#272738';
  });
}

function navigateTo(id) {
  const n = nodeById.get(id); if (!n) return;
  selected = n; setHighlight(n); openPanel(n);
  Graph.centerAt(n.x, n.y, 500); Graph.zoom(Math.max(Graph.zoom(), 2.5), 500);
}

const panel = document.getElementById('panel');
function openPanel(n) {
  document.getElementById('pTitle').textContent = n.label;
  const typ = document.getElementById('pType');
  typ.textContent = n.type; typ.style.background = (COLOR[n.type]||'#888')+'33';
  typ.style.color = COLOR[n.type] || '#aaa';
  document.getElementById('pMeta').textContent =
    (n.gew ? 'Gewijzigd: '+n.gew+' · ' : '') + `${n.deg} verbindingen`;
  const portals = document.getElementById('pPortals');
  portals.innerHTML = '';
  [ { url: n.url_opendata, icon: '📂', naam: 'Nationaal Georegister' } ].forEach(p => {
    if (!p.url) return;
    const a = document.createElement('a');
    a.href = p.url; a.target = '_blank'; a.rel = 'noopener';
    a.innerHTML = `<span class="icon">${p.icon}</span><span class="pname">${p.naam}</span><span class="arrow">↗</span>`;
    portals.appendChild(a);
  });
  document.getElementById('pSam').textContent = n.sam || '';
  const nbrs = [...(adj.get(n.id)||[])].map(id => nodeById.get(id)).filter(Boolean);
  const grp = {};
  nbrs.forEach(x => (grp[x.type] ??= []).push(x));
  const linksEl = document.getElementById('pLinks');
  linksEl.innerHTML = '';
  const MAX_CHIPS = 8;
  Object.entries(grp).forEach(([type, items]) => {
    const sec = document.createElement('div'); sec.className = 'nbr-section';
    const head = document.createElement('div'); head.className = 'nbr-head';
    head.style.color = COLOR[type] || '#aaa';
    head.textContent = `${type} (${items.length})`;
    sec.appendChild(head);
    const chips = document.createElement('div'); chips.className = 'nbr-chips';
    const vis = items.slice(0, MAX_CHIPS), rest = items.slice(MAX_CHIPS);
    vis.forEach(nbr => {
      const c = document.createElement('span'); c.className = 'nbr-chip';
      c.style.borderColor = (COLOR[type]||'#888')+'66';
      c.textContent = nbr.label; c.title = nbr.label;
      c.onclick = () => navigateTo(nbr.id);
      chips.appendChild(c);
    });
    sec.appendChild(chips);
    if (rest.length) {
      const more = document.createElement('button'); more.className = 'nbr-more';
      more.textContent = `+ ${rest.length} meer`;
      more.onclick = () => {
        rest.forEach(nbr => {
          const c = document.createElement('span'); c.className = 'nbr-chip';
          c.style.borderColor = (COLOR[type]||'#888')+'66';
          c.textContent = nbr.label; c.title = nbr.label;
          c.onclick = () => navigateTo(nbr.id);
          chips.appendChild(c);
        });
        more.remove();
      };
      sec.appendChild(more);
    }
    linksEl.appendChild(sec);
  });
  panel.classList.add('open');
}
function closePanel() { panel.classList.remove('open'); }
document.getElementById('closePanel').onclick = () => { closePanel(); selected = null; setHighlight(null); };

init();
</script>
</body>
</html>
