<link href="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@4.5.0/dist/maplibre-gl.js"></script>

<style>
  :root { --bg:#050510; --fg:#d5d5e0; --muted:#778; --panel:#0b0b1a; --border:#2a2a45;
          --dataset:#5b8cff; --topic:#ff7cc3; --trefwoord:#3fbf9f; --accent:#a78bfa; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; overflow:hidden }

  a.home-link { position:fixed; top:12px; left:12px; z-index:20;
    background:rgba(5,5,20,0.85); color:var(--accent); font-size:11px; font-weight:600;
    padding:6px 10px; border-radius:6px; border:1px solid var(--border);
    text-decoration:none; backdrop-filter:blur(4px); }

  #map { position:fixed; top:0; left:0; right:380px; bottom:0; }

  #panel { position:fixed; top:0; right:0; bottom:0; width:380px; max-width:100vw;
    background:var(--panel); border-left:1px solid var(--border);
    display:flex; flex-direction:column; z-index:10; }

  #panel-head { padding:44px 18px 14px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #panel-head h1 { font-size:15px; margin:0 0 4px; color:#fff; font-weight:700; }
  #panel-head p { font-size:12px; color:var(--muted); margin:0; line-height:1.5; }
  #panel-footer { padding:10px 18px; border-top:1px solid var(--border); flex-shrink:0; }
  #coverage-toggle { width:100%; text-align:left; background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:6px 10px; font-size:11px; cursor:pointer; }
  #coverage-toggle:hover { border-color:var(--accent); color:var(--fg); }
  #coverage-toggle.active { border-color:var(--accent); background:rgba(167,139,250,0.12); color:var(--accent); }

  .coverage-stats { font-size:12px; color:var(--muted); line-height:1.7; }
  .coverage-stats b { color:var(--fg); }
  .coverage-legend-scale { display:flex; height:10px; border-radius:4px; overflow:hidden; margin:10px 0 4px; }
  .coverage-legend-scale span { flex:1; }
  .coverage-legend-labels { display:flex; justify-content:space-between; font-size:10px; color:var(--muted); }
  .coverage-mode-toggle { display:flex; gap:6px; margin:10px 0 8px; }
  .color-mode-btn { flex:1; font-size:11px; padding:5px 8px; border-radius:6px; border:1px solid var(--border);
    background:none; color:var(--muted); cursor:pointer; }
  .color-mode-btn:hover { border-color:var(--accent); color:var(--fg); }
  .color-mode-btn.active { border-color:var(--accent); background:rgba(167,139,250,0.12); color:var(--accent); }
  .coverage-mode-toggle-inline { margin-top:8px; }
  .coverage-mode-toggle-inline .coverage-mode-toggle { margin:4px 0 6px; }
  .coverage-mode-toggle-inline .coverage-legend-scale { height:6px; margin:6px 0 3px; }
  .hex-back { display:block; background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; margin-bottom:12px; }
  .hex-back:hover { border-color:var(--accent); color:var(--fg); }

  #ask-form { padding:14px 18px; border-bottom:1px solid var(--border); flex-shrink:0; }
  #ask-input { width:100%; background:#0a0a16; border:1px solid var(--border); color:var(--fg);
    border-radius:6px; padding:9px 10px; font-size:13px; font-family:inherit; resize:none; }
  #ask-input:focus { outline:1px solid var(--accent) }
  #ask-submit { margin-top:8px; width:100%; background:var(--accent); border:none; color:#16162b;
    font-weight:700; border-radius:6px; padding:9px 14px; cursor:pointer; font-size:12.5px; }
  #ask-submit:hover { opacity:.9 }
  #ask-submit:disabled { opacity:.5; cursor:default }
  .examples { display:flex; flex-wrap:wrap; gap:5px; margin-top:9px; }
  .example-chip { font-size:11px; padding:3px 9px; border-radius:12px; border:1px solid var(--border);

  .example-chip:hover { border-color:var(--accent); color:var(--fg); }

  #panel-body { flex:1; overflow-y:auto; padding:14px 18px 24px; }

  .reasoning { font-size:12px; color:#c2c2d2; margin-bottom:12px; line-height:1.5; }
  .terms { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:16px; }
  .term-chip { font-size:11px; padding:3px 9px; border-radius:12px;

  .term-chip.no-match { border-color:var(--border); color:var(--muted); background:none;

  .result-count { font-size:11px; color:var(--muted); text-transform:uppercase;

  .result-count-row { display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .result-count-row .result-count { margin-bottom:0; }
  .analyze-btn { font-size:11px; padding:3px 9px; border-radius:12px; border:1px solid var(--accent);
    color:var(--accent); background:rgba(167,139,250,0.1); cursor:pointer; white-space:nowrap; flex-shrink:0; }
  .analyze-btn:hover { background:rgba(167,139,250,0.2); }
  .share-btn { font-size:12px; padding:3px 8px; border-radius:12px; border:1px solid var(--border);
    color:var(--muted); background:none; cursor:pointer; flex-shrink:0; }
  .share-btn:hover { border-color:var(--accent); color:var(--fg); }
  .result-item { padding:11px 0; border-top:1px solid var(--border); cursor:pointer; }
  .result-item:hover .result-title { color:var(--accent); }
  .result-item.active { background:rgba(167,139,250,0.08); margin:0 -18px; padding:11px 18px; }
  .result-title { font-size:13px; font-weight:600; color:var(--fg); margin-bottom:3px;
    display:flex; align-items:center; gap:7px; }
  .result-title > span:first-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .ngr-link { margin-left:auto; font-size:10px; font-weight:600; color:var(--muted); text-decoration:none; flex-shrink:0; }
  .ngr-link:hover { color:var(--accent); text-decoration:underline; }
  .avail-badge { font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px;
    padding:2px 6px; border-radius:8px; flex-shrink:0; border:1px solid transparent; }
  .avail-badge.wfs { background:rgba(63,191,159,0.12); border-color:var(--trefwoord); color:var(--trefwoord); }
  .avail-badge.wms { background:rgba(91,140,255,0.12); border-color:var(--dataset); color:var(--dataset); }
  .avail-badge.extent { background:none; border-color:var(--border); color:var(--muted); }
  .avail-badge.none { display:none; }
  .result-sam { font-size:11px; color:var(--muted); line-height:1.4;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .result-status { font-size:11px; margin-top:6px; line-height:1.5; }
  .result-status.loading { color:var(--muted); }
  .result-status.error { color:#ff9d7c; }
  .result-status a { color:var(--accent); }
  .result-status.ok { color:var(--trefwoord); }
  .related-toggle { margin-top:8px; background:none; border:none; color:var(--accent);
    font-size:11px; font-weight:600; cursor:pointer; padding:0; }
  .related-toggle:hover { text-decoration:underline; }
  .related-list { margin:8px -18px -11px; padding:2px 18px 4px; background:rgba(255,255,255,0.02);
    border-top:1px solid var(--border); }
  .related-list .result-item:first-child { border-top:none; }
  .related-list .result-item { padding:9px 0; }

  .filter-toggle { margin:10px 0 0; background:none; border:none; color:var(--accent);
    font-size:11px; font-weight:600; cursor:pointer; padding:0; display:block; }
  .filter-toggle:hover { text-decoration:underline; }
  .filter-panel { margin:8px 0 14px; padding:10px; background:rgba(255,255,255,0.02);
    border:1px solid var(--border); border-radius:8px; }
  .filter-label { display:block; font-size:10px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--muted); margin:8px 0 4px; }
  .filter-label:first-child { margin-top:0; }
  .filter-label-inline { display:flex; align-items:center; gap:6px; font-size:11px; color:var(--muted); margin-top:10px; }
  #filter-topic, #filter-bronhouder, #filter-area { width:100%; background:#0a0a16; border:1px solid var(--border); color:var(--fg);
    border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit; }
  #filter-topic:focus, #filter-bronhouder:focus, #filter-area:focus { outline:1px solid var(--accent); }
  .related-topics { margin-top:6px; font-size:11px; line-height:2; }
  .related-topics-label { color:var(--muted); margin-right:2px; }
  .related-topic-chip { font-size:10.5px; padding:2px 8px; border-radius:10px; border:1px solid var(--trefwoord);
    color:var(--trefwoord); background:rgba(63,191,159,0.1); cursor:pointer; margin:0 3px 3px 0; }
  .related-topic-chip:hover { background:rgba(63,191,159,0.2); }
  .filter-chips { display:flex; gap:5px; }
  .filter-chip { flex:1; font-size:11px; padding:5px 6px; border-radius:6px; border:1px solid var(--border);
    background:none; color:var(--muted); cursor:pointer; }
  .filter-chip.active { border-color:var(--accent); background:rgba(167,139,250,0.12); color:var(--accent); }
  .filter-clear { display:block; margin-top:12px; background:none; border:1px solid var(--border);
    color:var(--muted); border-radius:6px; padding:5px 10px; font-size:11px; cursor:pointer; width:100%; }
  .filter-clear:hover { border-color:var(--accent); color:var(--fg); }

  .empty { font-size:12px; color:var(--muted); line-height:1.6; }
  .hub-heading { font-size:11px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted);
    margin:18px 0 8px; }

  .kg-spinner { width:20px; height:20px; border:3px solid rgba(167,139,250,0.15);
    border-top-color:var(--accent); border-radius:50%; animation:kg-spin 0.8s linear infinite;
    display:inline-block; vertical-align:middle; margin-right:8px; }
  @keyframes kg-spin { to { transform:rotate(360deg); } }

  #map-legend { position:fixed; left:12px; bottom:12px; z-index:10;
    background:rgba(11,11,26,0.85); backdrop-filter:blur(8px); padding:8px 12px;
    border:1px solid var(--border); border-radius:8px; font-size:11px; color:var(--muted);
    display:none; max-width:340px; }
  #map-legend b { color:var(--fg); }

  .maplibregl-popup-content { background:rgba(11,11,26,0.97); border:1px solid var(--border);
    border-radius:8px; padding:10px 12px; font-size:11px; color:var(--fg); }
  .popup-inner { max-height:200px; overflow-y:auto; line-height:1.7; }
  .popup-inner b { color:var(--muted); margin-right:4px; }
  .popup-hex-list { max-height:220px; overflow-y:auto; font-size:12px; }
  .popup-hex-list b { display:block; color:var(--fg); margin-bottom:4px; }
  .popup-hex-item { padding:5px 0; border-top:1px solid var(--border); line-height:1.4;
    display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .popup-hex-title { cursor:pointer; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .popup-hex-title:hover { color:var(--accent); }
  .popup-hex-ngr { font-size:10px; color:var(--muted); text-decoration:none; flex-shrink:0; }
  .popup-hex-ngr:hover { color:var(--accent); text-decoration:underline; }

  @media (max-width: 720px) {
    #map { right:0; bottom:45vh; }
    #panel { top:auto; height:45vh; width:100%; border-left:none; border-top:1px solid var(--border); }
    #panel-head { padding:14px 18px; }
  }
</style>
</head>
<body>

<a href="/" class="home-link">← Maps That Matter</a>

<div id="map"></div>
<div id="map-legend"></div>

<div id="panel">
  <div id="panel-head">
    <h1>Vraag de Kennisgraaf</h1>
    <p>Stel een vraag over Nederlandse geodata — het antwoord komt uit de 5.824 datasets van het Nationaal Georegister.</p>
  </div>
  <div id="ask-form">
    <textarea id="ask-input" rows="2" placeholder="bv. “waar vind ik data over bodemvervuiling”" aria-label="Stel een vraag aan de kennisgraaf"></textarea>
    <button id="ask-submit" aria-label="Vraag versturen">Vraag</button>
    <div class="examples">
      <button class="example-chip" type="button">bodemvervuiling</button>
      <button class="example-chip" type="button">grondwater</button>
      <button class="example-chip" type="button">geluidscontouren</button>
      <button class="example-chip" type="button">fietspaden</button>
    </div>
  </div>
  <div id="panel-body">
    <div class="empty" id="empty-state">Laden van de kennisgraaf…</div>
  </div>
  <div id="panel-footer">
    <button id="coverage-toggle" type="button">📊 Landelijke dekkingskaart</button>
  </div>
</div>

<script>
const DATA_URL = '/data/kennisgraaf_ngr.json';
const COLOR = { dataset:'#5b8cff', topic:'#ff7cc3', trefwoord:'#3fbf9f' };
const MAX_FEATURES = 1000;

let GRAPH, adj, nodeById, vocab;
let currentBbox = null; // [minLon, minLat, maxLon, maxLat] van de laatst herkende plaatsnaam
let filterAreaBbox = null;     // [minLon, minLat, maxLon, maxLat] van het "Gebied"-filter, apart van currentBbox (AI-locatie)
let filterAreaDebounce = null;
let currentRankedNodes = []; // laatste zoekresultaat, buiten askKennisgraaf's closure om — nodig om een gedeelde URL te bouwen/herstellen

async function init() {
  const map = window.map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: { carto: {
        type: 'raster',
        tiles: ['https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'],
        tileSize: 256,
        attribution: '© OpenStreetMap contributors · © CARTO'
      }},
      layers: [{ id:'carto-bg', type:'raster', source:'carto' }]
    },
    glyphs: 'https://fonts.openmaptiles.org/{fontstack}/{range}.pbf',
    center: [5.3, 52.15], zoom: 6.7,
    attributionControl: false
  });
  map.addControl(new maplibregl.NavigationControl(), 'bottom-right');
  map.addControl(new maplibregl.AttributionControl({ customAttribution: 'Nationaal Georegister' }), 'bottom-left');

  let data;
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
  } catch (err) {
    document.getElementById('empty-state').textContent = 'Kon de kennisgraaf niet laden. Probeer de pagina te vernieuwen.';
    console.error('Kennisgraaf laden mislukt:', err);
    return;
  }
  GRAPH = data;
  nodeById = new Map(GRAPH.nodes.map(n => [n.id, n]));
  adj = new Map();
  GRAPH.nodes.forEach(n => adj.set(n.id, new Set()));
  GRAPH.links.forEach(l => { adj.get(l.source)?.add(l.target); adj.get(l.target)?.add(l.source); });
  vocab = kgBuildVocabIndex(GRAPH);

  renderEmptyStateWithHubs();

  wireForm();
  restoreFromURL();
}

function wireForm() {
  const input  = document.getElementById('ask-input');
  const btn    = document.getElementById('ask-submit');
  const submit = () => { const q = input.value.trim(); if (q) askKennisgraaf(q); };
  btn.addEventListener('click', submit);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); }
  });
  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => { input.value = chip.textContent; submit(); });
  });
  document.getElementById('coverage-toggle').addEventListener('click', toggleCoverageMode);
}

// Cold-start: in plaats van een kale prompt, meteen iets te ontdekken.
// Graafgraad (deg) is al op elke knoop aanwezig — geen berekening nodig,
// gewoon sorteren. Hoge graad = veel topic/trefwoord-verbindingen = vaak een
// foundational referentiedataset (BAG, BRT, CBS-grenzen e.d.).
function topDatasetsByDegree(limit = 6) {
  return GRAPH.nodes.filter(n => n.type === 'dataset')
    .sort((a, b) => (b.deg || 0) - (a.deg || 0))
    .slice(0, limit);
}

function renderEmptyStateWithHubs() {
  document.getElementById('panel-body').innerHTML = `
    <div class="empty">Stel een vraag hierboven, of probeer een van de voorbeelden.</div>
    <div class="hub-heading">Of begin bij een van de meest verbonden datasets:</div>
    <div id="hub-list"></div>`;
  const list = document.getElementById('hub-list');
  topDatasetsByDegree().forEach(n => list.appendChild(buildResultItem(n)));
}

async function askKennisgraaf(question) {
  const body    = document.getElementById('panel-body');
  const btn     = document.getElementById('ask-submit');

  body.innerHTML = '<div class="empty"><span class="kg-spinner"></span>Zoeken in de kennisgraaf…</div>';
  btn.disabled = true;

  let ai;
  try {
    const res = await fetch('/api/ask-kennisgraaf', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question }),
    });
    ai = await res.json();
    if (!res.ok || ai.error) throw new Error(ai.error || 'Onbekende fout');
  } catch (err) {
    body.innerHTML = `<div class="empty">Kon de vraag niet verwerken: ${esc(String(err.message || err))}</div>`;
    btn.disabled = false;
    return;
  }

  const matchedTermIds = new Set();
  const datasetScores  = new Map();
  const termChips = [];

  currentBbox = null;
  let locationNote = '';
  if (ai.location) {
    try {
      const locRes = await fetch('/api/pdok-location?q=' + encodeURIComponent(ai.location));
      const loc = await locRes.json();
      if (loc.bbox) {
        currentBbox = loc.bbox;
        map.fitBounds([[loc.bbox[0], loc.bbox[1]], [loc.bbox[2], loc.bbox[3]]], { padding: 40, duration: 800 });
        locationNote = `<div class="reasoning" style="color:var(--accent)">📍 Gescoped op ${esc(loc.display_name)}</div>`;
      }
    } catch { /* geocoding is best-effort; vraag blijft landelijk als dit faalt */ }
  }

  ai.keywords.forEach(kw => {
    const matches = kgMatchTerm(vocab, kw);
    termChips.push({ kw, matched: matches.length > 0 });
    matches.forEach(m => {
      matchedTermIds.add(m.id);
      (adj.get(m.id) || []).forEach(dsId => {
        const dsNode = nodeById.get(dsId);
        if (!dsNode || dsNode.type !== 'dataset') return;
        const entry = datasetScores.get(dsId) || { score: 0, viaTerms: new Set() };
        entry.score += m.score;
        entry.viaTerms.add(m.id);
        datasetScores.set(dsId, entry);
      });
    });
  });

  const ranked = [...datasetScores.entries()]
    .sort((a, b) => (b[1].viaTerms.size - a[1].viaTerms.size) || (b[1].score - a[1].score))
    .slice(0, 15);

  const termsHtml = termChips.map(t =>
    `<span class="term-chip${t.matched ? '' : ' no-match'}">${esc(t.kw)}</span>`).join('');

  if (!ranked.length) {
    const msg = matchedTermIds.size
      ? 'Deze termen komen voor in de catalogus, maar zijn niet aan datasets gekoppeld.'
      : 'Geen van de voorgestelde termen komt voor in de kennisgraaf. Probeer de vraag anders te formuleren.';
    body.innerHTML = `<div class="reasoning">${esc(ai.reasoning || '')}</div>
      ${locationNote}
      <div class="terms">${termsHtml}</div>
      <div class="empty">${msg}</div>`;
  } else {
    const rankedNodes = ranked.map(([dsId]) => nodeById.get(dsId));
    currentRankedNodes = rankedNodes;
    filterAreaBbox = null;
    clearTimeout(filterAreaDebounce); // anders kan een oud gebied-filter, gedebouncet vóór de nieuwe vraag, alsnog vuren tegen een inmiddels vervangen resultatenlijst
    body.innerHTML = `<div class="reasoning">${esc(ai.reasoning || '')}</div>
      ${locationNote}
      <div class="terms">${termsHtml}</div>
      <div class="result-count-row">
        <div class="result-count" id="result-count-text">${ranked.length} datasets gevonden</div>
        <button class="analyze-btn" id="analyze-btn" type="button">🔬 Op de kaart</button>
        <button class="share-btn" id="share-btn" type="button" title="Kopieer deelbare link">🔗</button>
      </div>
      <div class="result-status" id="analyze-status"></div>
      ${buildFilterBarHTML(rankedNodes)}
      <div id="result-list"></div>`;
    wireFilterBar(rankedNodes);
    refreshResultList(rankedNodes);
    document.getElementById('analyze-btn').addEventListener('click', () =>
      analyzeResultsOnMap(applyFilters(rankedNodes).map(n => n.id)));
    document.getElementById('share-btn').addEventListener('click', e => shareCurrentSearch(e.currentTarget, question));
  }

  btn.disabled = false;
}

// wfs_url/wms_url/extent are baked straight into the kennisgraaf nodes at
// harvest time (see graph-geonetwork/build_graph.py) — parsed once from the
// ISO19139 XML per dataset instead of live-fetched per session. Badges and
// showOnMap() both read this synchronously, no network round-trip at all
// until a WFS/WMS layer is actually fetched.
function recordFor(node) {
  return {
    wfs: node.wfs_url ? { url: node.wfs_url, typeName: node.wfs_typename } : null,
    wms: node.wms_url ? { url: node.wms_url, layer: node.wms_layer } : null,
    extent: node.extent ? node.extent.split(',').map(Number) : null,
  };
}

function badgeFor(rec) {
  if (rec.wfs) return { cls: 'wfs', label: 'WFS' };
  if (rec.wms) return { cls: 'wms', label: 'WMS' };
  if (rec.extent) return { cls: 'extent', label: 'gebied' };
  return { cls: 'none', label: '' };
}

// Gedeeld door de zoekresultatenlijst en de hexagon-datasetlijst (was twee
// bijna-identieke innerHTML-blokken). NGR-link staat er nu altijd bij, niet
// alleen in de foutstatus — je moet altijd naar de bron kunnen doorklikken,
// ook als de kaartweergave prima lukt.
// Pure graph traversal, geen fetch: datasets die minstens één topic/trefwoord
// delen met n, gerangschikt op aantal gedeelde buren. adj bevat alleen
// dataset<->topic/trefwoord-kanten (geen directe dataset-dataset-kanten in
// deze graph), dus de type-check hieronder is defensief, niet strikt nodig.
function relatedDatasets(node, limit = 5) {
  const scores = new Map(); // datasetId -> aantal gedeelde topic/trefwoord-buren
  (adj.get(node.id) || []).forEach(neighborId => {
    const neighbor = nodeById.get(neighborId);
    if (!neighbor || (neighbor.type !== 'topic' && neighbor.type !== 'trefwoord')) return;
    (adj.get(neighborId) || []).forEach(otherId => {
      if (otherId === node.id) return;
      const other = nodeById.get(otherId);
      if (!other || other.type !== 'dataset') return;
      scores.set(otherId, (scores.get(otherId) || 0) + 1);
    });
  });
  return [...scores.entries()]
    .sort((a, b) => b[1] - a[1])
    .slice(0, limit)
    .map(([id]) => nodeById.get(id));
}

// depth=0 (zoekresultaten/hexagon-lijst) krijgt een "Gerelateerd"-toggle;
// depth=1 (de gerelateerde items zelf) niet — voorkomt een oneindig
// uitklapbare accordeon, maar gerelateerde items blijven verder volledig
// functioneel (eigen badge, NGR-link, status, klik = op de kaart).
function buildResultItem(n, depth = 0) {
  const b = badgeFor(recordFor(n));
  const item = document.createElement('div');
  item.className = 'result-item';
  item.innerHTML = `<div class="result-title">
      <span>${esc(n.label)}</span>
      <span class="avail-badge ${b.cls}">${esc(b.label)}</span>
      <a class="ngr-link" href="${esc(n.url_opendata)}" target="_blank" rel="noopener" title="Bekijk in Nationaal Georegister">NGR ↗</a>
    </div>
    <div class="result-sam">${esc(n.sam || '')}</div>
    ${depth === 0 ? '<button class="related-toggle" type="button">▸ Gerelateerd</button><div class="related-list" style="display:none"></div>' : ''}
    <div class="result-status" id="status-${cssId(n.id)}"></div>`;
  item.querySelector('.ngr-link').addEventListener('click', e => e.stopPropagation());
  item.addEventListener('click', () => showOnMap(n, item));

  if (depth === 0) {
    const toggle = item.querySelector('.related-toggle');
    const relatedList = item.querySelector('.related-list');
    let loaded = false;
    toggle.addEventListener('click', e => {
      e.stopPropagation();
      const isOpen = relatedList.style.display !== 'none';
      if (isOpen) {
        relatedList.style.display = 'none';
        toggle.textContent = '▸ Gerelateerd';
        return;
      }
      if (!loaded) {
        const related = relatedDatasets(n);
        if (!related.length) {
          relatedList.innerHTML = '<div class="empty" style="padding:4px 0 2px">Geen gerelateerde datasets gevonden.</div>';
        } else {
          related.forEach(rn => relatedList.appendChild(buildResultItem(rn, depth + 1)));
        }
        loaded = true;
      }
      relatedList.style.display = 'block';
      toggle.textContent = '▾ Gerelateerd';
    });
  }

  return item;
}

function cssId(id) { return id.replace(/[^a-zA-Z0-9]/g, ''); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Filters: refinement op het huidige zoekresultaat, geen nieuwe zoekopdracht ──
// Onderwerp-opties komen uit het VOLLEDIGE (ongefilterde) resultaat en blijven
// stabiel terwijl andere filters de zichtbare lijst versmallen — anders
// verdwijnen/verschijnen opties terwijl je aan het filteren bent.
function buildFilterBarHTML(nodes) {
  const topicCounts = new Map();
  nodes.forEach(n => {
    (adj.get(n.id) || []).forEach(neighborId => {
      const neighbor = nodeById.get(neighborId);
      if (neighbor?.type === 'topic') topicCounts.set(neighborId, (topicCounts.get(neighborId) || 0) + 1);
    });
  });
  const topicOptions = [...topicCounts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([id, count]) => `<option value="${esc(id)}">${esc(nodeById.get(id).label)} (${count})</option>`)
    .join('');

  const bronhouderCounts = new Map();
  nodes.forEach(n => { if (n.bronhouder) bronhouderCounts.set(n.bronhouder, (bronhouderCounts.get(n.bronhouder) || 0) + 1); });
  const bronhouderOptions = [...bronhouderCounts.entries()]
    .sort((a, b) => b[1] - a[1])
    .map(([name, count]) => `<option value="${esc(name)}">${esc(name)} (${count})</option>`)
    .join('');

  return `
    <button class="filter-toggle" id="filter-toggle" type="button">▸ Filters</button>
    <div class="filter-panel" id="filter-panel" style="display:none">
      <label class="filter-label" for="filter-topic">Onderwerp</label>
      <select id="filter-topic"><option value="">Alle onderwerpen</option>${topicOptions}</select>
      <div class="related-topics" id="related-topics" style="display:none"></div>
      <label class="filter-label" for="filter-bronhouder">Bronhouder</label>
      <select id="filter-bronhouder"><option value="">Alle bronhouders</option>${bronhouderOptions}</select>
      <label class="filter-label" for="filter-area">Gebied</label>
      <input type="text" id="filter-area" placeholder="bv. Utrecht" autocomplete="off" />
      <label class="filter-label">Type</label>
      <div class="filter-chips">
        <button class="filter-chip active" data-type="wfs" type="button">WFS</button>
        <button class="filter-chip active" data-type="wms" type="button">WMS</button>
        <button class="filter-chip active" data-type="extent" type="button">Gebied</button>
      </div>
      <label class="filter-label-inline"><input type="checkbox" id="filter-fresh" /> Alleen recent (&lt; 3 jaar)</label>
      <button class="filter-clear" id="filter-clear" type="button">Wis filters</button>
    </div>`;
}

function filtersActive() {
  const topicId = document.getElementById('filter-topic')?.value;
  const bronhouder = document.getElementById('filter-bronhouder')?.value;
  const area = document.getElementById('filter-area')?.value?.trim();
  const activeTypes = [...document.querySelectorAll('.filter-chip.active')].map(el => el.dataset.type);
  const fresh = document.getElementById('filter-fresh')?.checked;
  return !!(topicId || bronhouder || area || fresh || activeTypes.length < 3);
}

// Eén plek voor het label, ipv losse textContent-toewijzingen her en der —
// zet zowel de open/dicht-pijl als een bolletje wanneer er filters actief
// zijn, ook terwijl het paneel is ingeklapt (anders is niet zichtbaar dát
// er gefilterd wordt zonder het paneel open te klikken).
function updateFilterToggleLabel() {
  const toggle = document.getElementById('filter-toggle');
  const panel = document.getElementById('filter-panel');
  if (!toggle || !panel) return;
  const arrow = panel.style.display !== 'none' ? '▾' : '▸';
  toggle.textContent = `${arrow} Filters${filtersActive() ? ' ●' : ''}`;
}

function wireFilterBar(nodes) {
  const toggle = document.getElementById('filter-toggle');
  const panel = document.getElementById('filter-panel');
  toggle.addEventListener('click', () => {
    panel.style.display = panel.style.display !== 'none' ? 'none' : 'block';
    updateFilterToggleLabel();
  });

  document.getElementById('filter-topic').addEventListener('change', () => {
    updateRelatedTopicsUI(nodes);
    refreshResultList(nodes);
  });
  document.getElementById('filter-bronhouder').addEventListener('change', () => refreshResultList(nodes));
  document.getElementById('filter-fresh').addEventListener('change', () => refreshResultList(nodes));
  document.querySelectorAll('.filter-chip').forEach(chip => {
    chip.addEventListener('click', () => { chip.classList.toggle('active'); refreshResultList(nodes); });
  });

  document.getElementById('filter-clear').addEventListener('click', () => {
    document.getElementById('filter-topic').value = '';
    document.getElementById('filter-bronhouder').value = '';
    document.getElementById('filter-area').value = '';
    filterAreaBbox = null;
    clearTimeout(filterAreaDebounce);
    document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.add('active'));
    document.getElementById('filter-fresh').checked = false;
    updateRelatedTopicsUI(nodes);
    refreshResultList(nodes);
  });

  const areaInput = document.getElementById('filter-area');
  areaInput.addEventListener('input', () => {
    clearTimeout(filterAreaDebounce);
    const q = areaInput.value.trim();
    if (!q) { filterAreaBbox = null; refreshResultList(nodes); return; }
    filterAreaDebounce = setTimeout(async () => {
      try {
        const res = await fetch('/api/pdok-location?q=' + encodeURIComponent(q));
        const loc = await res.json();
        filterAreaBbox = loc.bbox || null;
      } catch { filterAreaBbox = null; }
      refreshResultList(nodes);
    }, 400);
  });
}

// Verwante-onderwerpen-chips onder de Onderwerp-dropdown, uit
// related_topic_ids (topic-cooccurrentie, geëxporteerd door build_graph.py).
// Alleen tonen wat ook echt in de HUIDIGE dropdown zit — anders stuurt een
// klik je naar een onderwerp waar in dit zoekresultaat toch niks bij zit.
function updateRelatedTopicsUI(nodes) {
  const topicSelect = document.getElementById('filter-topic');
  const container = document.getElementById('related-topics');
  const topicId = topicSelect.value;
  if (!topicId) { container.style.display = 'none'; container.innerHTML = ''; return; }
  const optionIds = new Set([...topicSelect.options].map(o => o.value));
  const relatedIds = (nodeById.get(topicId)?.related_topic_ids || []).filter(id => optionIds.has(id));
  if (!relatedIds.length) { container.style.display = 'none'; container.innerHTML = ''; return; }
  container.style.display = 'block';
  container.innerHTML = '<span class="related-topics-label">Verwant:</span> ' +
    relatedIds.map(id => `<button class="related-topic-chip" data-id="${esc(id)}" type="button">${esc(nodeById.get(id).label)}</button>`).join('');
  container.querySelectorAll('.related-topic-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      topicSelect.value = chip.dataset.id;
      updateRelatedTopicsUI(nodes);
      refreshResultList(nodes);
    });
  });
}

const FILTER_YEAR_MS = 365.25 * 86400 * 1000;

function applyFilters(nodes) {
  const topicId = document.getElementById('filter-topic')?.value || '';
  const bronhouder = document.getElementById('filter-bronhouder')?.value || '';
  const activeTypes = [...document.querySelectorAll('.filter-chip.active')].map(el => el.dataset.type);
  const freshOnly = document.getElementById('filter-fresh')?.checked || false;
  const now = Date.now();

  return nodes.filter(n => {
    if (topicId && !(adj.get(n.id) || new Set()).has(topicId)) return false;
    if (bronhouder && n.bronhouder !== bronhouder) return false;
    if (activeTypes.length < 3) {
      const cls = badgeFor(recordFor(n)).cls;
      if (cls === 'none' || !activeTypes.includes(cls)) return false;
    }
    if (freshOnly) {
      const age = (now - Date.parse(n.gew)) / FILTER_YEAR_MS;
      if (!(age >= 0 && age < 3)) return false;
    }
    if (filterAreaBbox) {
      if (!n.extent) return false;
      const [w, s, e, no] = n.extent.split(',').map(Number);
      const [bw, bs, be, bn] = filterAreaBbox;
      if (e < bw || w > be || no < bs || s > bn) return false; // geen overlap
    }
    return true;
  });
}

function refreshResultList(nodes) {
  const filtered = applyFilters(nodes);
  const list = document.getElementById('result-list');
  list.innerHTML = '';
  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Geen datasets voldoen aan deze filters.</div>';
  } else {
    filtered.forEach(n => list.appendChild(buildResultItem(n)));
  }
  const countEl = document.getElementById('result-count-text');
  if (countEl) {
    countEl.textContent = filtered.length === nodes.length
      ? `${nodes.length} datasets gevonden`
      : `${filtered.length} van ${nodes.length} datasets`;
  }
  updateFilterToggleLabel();
}

// Deelbare link: kopieert alleen (raakt de adresbalk zelf niet aan, geen
// history.pushState-gedoe). Codeert de vraag + actieve filters — geen
// AI-resultaat (keywords/reasoning), dus het herladen van een gedeelde link
// roept ask-kennisgraaf opnieuw aan. Bij lage temperature vrijwel altijd
// dezelfde termen, en het scheelt een hoop state om te serialiseren.
function buildShareURL(question) {
  const params = new URLSearchParams();
  params.set('q', question);
  const topicId = document.getElementById('filter-topic')?.value;
  if (topicId) params.set('topic', topicId);
  const bronhouder = document.getElementById('filter-bronhouder')?.value;
  if (bronhouder) params.set('bron', bronhouder);
  const area = document.getElementById('filter-area')?.value?.trim();
  if (area) params.set('area', area);
  const activeTypes = [...document.querySelectorAll('.filter-chip.active')].map(el => el.dataset.type);
  if (activeTypes.length && activeTypes.length < 3) params.set('types', activeTypes.join(','));
  if (document.getElementById('filter-fresh')?.checked) params.set('fresh', '1');
  const url = new URL(window.location.href);
  url.search = params.toString();
  return url.toString();
}

async function shareCurrentSearch(btn, question) {
  const url = buildShareURL(question);
  const original = btn.textContent;
  try {
    await navigator.clipboard.writeText(url);
    btn.textContent = '✓';
  } catch {
    window.prompt('Kopieer deze link:', url); // clipboard-permissie geweigerd — handmatige fallback
  }
  setTimeout(() => { btn.textContent = original; }, 1500);
}

// Bij het openen van een gedeelde link: vraag opnieuw stellen, dan de
// meegegeven filters toepassen zodra de resultatenlijst (en dus de
// filterbalk) daadwerkelijk bestaat.
async function restoreFromURL() {
  const params = new URLSearchParams(location.search);
  const q = params.get('q');
  if (!q) return;
  document.getElementById('ask-input').value = q;
  await askKennisgraaf(q);

  const topicId = params.get('topic');
  const bron = params.get('bron');
  const area = params.get('area');
  const types = params.get('types');
  const fresh = params.get('fresh') === '1';
  // Ook afbreken als de vraag deze keer geen resultaten opleverde (AI is niet
  // volledig deterministisch) — dan bestaat de filterbalk/resultatenlijst
  // niet, en zou refreshResultList() verderop crashen op een null element.
  if ((!topicId && !bron && !area && !types && !fresh) || !document.getElementById('result-list')) return;

  const topicSelect = document.getElementById('filter-topic');
  if (topicId && topicSelect && [...topicSelect.options].some(o => o.value === topicId)) {
    topicSelect.value = topicId;
    updateRelatedTopicsUI(currentRankedNodes);
  }
  const bronSelect = document.getElementById('filter-bronhouder');
  if (bron && bronSelect && [...bronSelect.options].some(o => o.value === bron)) {
    bronSelect.value = bron;
  }
  if (area) {
    const areaInput = document.getElementById('filter-area');
    if (areaInput) {
      areaInput.value = area;
      try {
        const res = await fetch('/api/pdok-location?q=' + encodeURIComponent(area));
        const loc = await res.json();
        filterAreaBbox = loc.bbox || null;
      } catch { filterAreaBbox = null; }
    }
  }
  if (types) {
    const activeSet = new Set(types.split(','));
    document.querySelectorAll('.filter-chip').forEach(chip => chip.classList.toggle('active', activeSet.has(chip.dataset.type)));
  }
  if (fresh) {
    const cb = document.getElementById('filter-fresh');
    if (cb) cb.checked = true;
  }

  const panel = document.getElementById('filter-panel');
  const toggle = document.getElementById('filter-toggle');
  if (panel && toggle) { panel.style.display = 'block'; }
  refreshResultList(currentRankedNodes);
}

async function showOnMap(node, itemEl) {
  document.querySelectorAll('.result-item.active').forEach(el => el.classList.remove('active'));
  itemEl.classList.add('active');
  const statusEl = itemEl.querySelector('.result-status');
  const rec = recordFor(node);

  if (!rec.wfs) {
    // wms/extent presence is already known from the badge — this always succeeds
    // unless a genuinely broken/missing case slipped through (shouldn't happen).
    if (tryFallback(node, rec, statusEl, 'Geen WFS-service')) return;
    statusEl.className = 'result-status error';
    statusEl.innerHTML = `Geen kaartservice gevonden voor deze dataset — <a href="${esc(node.url_opendata)}" target="_blank" rel="noopener">bekijk in NGR</a>`;
    return;
  }

  statusEl.className = 'result-status loading';
  statusEl.innerHTML = '<span class="kg-spinner" style="width:12px;height:12px;border-width:2px"></span>Data ophalen…';

  let gj, truncated;
  try {
    const params = new URLSearchParams({ wfsUrl: rec.wfs.url, typeName: rec.wfs.typeName, pageSize: MAX_FEATURES });
    if (currentBbox) params.set('bbox', currentBbox.join(','));
    const res = await fetch('/api/ngr-wfs-proxy?' + params);
    gj = await res.json();
    if (!res.ok) throw new Error(gj.error || 'Onbekende fout');
    truncated = res.headers.get('X-Truncated') === '1';
  } catch (err) {
    // Common case: an ArcGIS-hosted WFS that only speaks GML, not GeoJSON.
    if (tryFallback(node, rec, statusEl, `WFS-data niet beschikbaar (${esc(err.message)})`)) return;
    statusEl.className = 'result-status error';
    statusEl.innerHTML = `Kon de data niet ophalen: ${esc(err.message)} — <a href="${esc(node.url_opendata)}" target="_blank" rel="noopener">bekijk in NGR</a>`;
    return;
  }

  if (!gj.features?.length) {
    if (tryFallback(node, rec, statusEl, 'WFS leverde geen features op')) return;
    statusEl.className = 'result-status error';
    statusEl.textContent = 'Deze service leverde geen features op.';
    return;
  }

  renderOnMap(gj, node, rec.wfs.typeName);

  statusEl.className = 'result-status ok';
  statusEl.textContent = `✓ ${gj.features.length.toLocaleString('nl-NL')} features op de kaart` +
    (truncated ? ' (mogelijk niet volledig — eerste ' + MAX_FEATURES + ')' : '');
}

// Three-tier fallback, in order of how much it actually shows: WFS features
// (handled by the caller before this is ever reached) > WMS raster overlay
// > geographic extent outline (coverage area only, not real data — this is
// the one that's almost always available, since it's a mandatory ISO19115
// field even for datasets with no live map service at all). Returns true if
// something got rendered.
function tryFallback(node, rec, statusEl, reasonPrefix) {
  if (rec.wms) {
    renderWmsOnMap(node, rec.wms);
    statusEl.className = 'result-status ok';
    statusEl.innerHTML = `${reasonPrefix} — getoond als kaartlaag (WMS)`;
    return true;
  }
  if (rec.extent) {
    renderExtentOnMap(node, rec.extent);
    statusEl.className = 'result-status ok';
    statusEl.innerHTML = `${reasonPrefix} — dekkingsgebied getoond (geen kaartservice, alleen indicatief)`;
    return true;
  }
  return false;
}

function clearMapLayers() {
  const map = window.map;
  ['wfs-fill', 'wfs-line', 'wfs-circle'].forEach(id => map.off('click', id, onFeatureClick));
  map.off('click', 'coverage-fill', onCoverageClick);
  ['wfs-fill', 'wfs-line', 'wfs-circle', 'wms-raster', 'extent-fill', 'extent-line', 'coverage-fill', 'coverage-line']
    .forEach(id => { if (map.getLayer(id)) map.removeLayer(id); });
  ['wfs', 'wms', 'extent', 'coverage'].forEach(id => { if (map.getSource(id)) map.removeSource(id); });
}

// ── Dekkingskaart: H3-aggregatie van alle dataset-extents ───────────────────
// Elke dataset heeft al een extent (zie hierboven) — dit telt, per H3-hexagon,
// hoeveel dataset-extents die hexagon overlappen, en toont dat als een
// landelijke dichtheidskaart. Werkt volledig uit al-geladen data, geen fetch.
//
// COVERAGE_AREA_CAP filtert overduidelijk foutieve metadata: sommige NGR-
// records hebben een extent die half Europa beslaat (bron: verkeerd
// ingevoerde metadata, niet een echt zo grote dataset) — zonder deze grens
// zou zo'n record alle omliggende landen laten "oplichten" alsof daar
// evenveel Nederlandse data zit, en de polyfill-berekening voor zo'n enorme
// rechthoek kan de H3 WASM-heap laten overlopen. 50 vierkante graden ≈ 4x
// Nederland zelf — genereus voor grensoverschrijdende (INSPIRE) datasets,
// hard genoeg om de foutieve half-Europa-extents eruit te filteren.
const COVERAGE_RES = 5;
const COVERAGE_AREA_CAP = 50;
let coverageMode = false;
let coverageData = null;   // { fc, included, excluded, cellDatasets } — landelijke berekening, eenmalig (~3 sec), daarna hergebruikt
let activeCoverage = null; // welke coverage-data er nu op de kaart staat (landelijk óf gescoped op zoekresultaten) — klik/legenda-logica leest hiervan, niet rechtstreeks van coverageData

function extentIsSane(w, s, e, n) {
  if (![w, s, e, n].every(Number.isFinite)) return false;
  if (w < -30 || e > 40 || s < 25 || n > 72) return false;
  if (e <= w || n <= s) return false;
  if ((e - w) * (n - s) > COVERAGE_AREA_CAP) return false;
  return true;
}

// datasetIds: optioneel — beperk de aggregatie tot deze datasets (bv. de
// resultaten van de huidige vraag) i.p.v. de hele catalogus. Zelfde logica,
// gewoon een kleinere input — een gescoped analyse van 15 resultaten is
// vrijwel instant, geen aparte code-paden nodig.
// async + periodieke yields (setTimeout 0 elke CHUNK datasets) i.p.v. één
// synchrone doorloop — bij de landelijke analyse (~5.800 datasets) bevroor
// dat de hele tab voor ~3,6 sec (klikken/scrollen elders deed niks, alleen
// de spinner-animatie bleef draaien omdat die compositor-only is). Bij een
// gescoped analyse (≤15 datasets, altijd al <50ms) slaat de yield-check nooit
// aan — geen gedragsverandering daar, gewoon dezelfde functie.
async function computeCoverageData(datasetIds = null) {
  const CHUNK = 300;
  // h3-index -> Set<datasetId>, niet alleen een telling — zo kan een klik op een
  // hexagon straks de daadwerkelijke datasets tonen (KnowWhereGraph-patroon:
  // cel als knoop met edges naar de entiteiten erin, i.p.v. de cel alleen als
  // rendering-laag te gebruiken).
  const cellDatasets = new Map();
  let included = 0, excluded = 0;
  const nodes = datasetIds
    ? datasetIds.map(id => nodeById.get(id)).filter(x => x && x.type === 'dataset')
    : GRAPH.nodes.filter(x => x.type === 'dataset');
  for (let i = 0; i < nodes.length; i++) {
    const node = nodes[i];
    if (!node.extent) { excluded++; }
    else {
      const [w, s, e, n] = node.extent.split(',').map(Number);
      if (!extentIsSane(w, s, e, n)) { excluded++; }
      else {
        const ring = [[w, s], [e, s], [e, n], [w, n], [w, s]];
        try {
          h3.polyfill([ring], COVERAGE_RES, true).forEach(idx => {
            if (!cellDatasets.has(idx)) cellDatasets.set(idx, new Set());
            cellDatasets.get(idx).add(node.id);
          });
          included++;
        } catch {
          // een handvol extents blijft ook binnen de oppervlaktegrens te complex voor
          // polyfill (bv. een smalle, kilometers lange kustlijnstrook) — overslaan
          // i.p.v. de hele berekening te laten crashen op één rare dataset
          excluded++;
        }
      }
    }
    if (i % CHUNK === CHUNK - 1) await new Promise(r => setTimeout(r, 0));
  }
  const YEAR_MS = 365.25 * 86400 * 1000;
  const now = Date.now();
  const features = [...cellDatasets.entries()].map(([idx, dsIds]) => {
    const boundary = h3.h3ToGeoBoundary(idx, true);
    boundary.push(boundary[0]);
    // Leeftijd (jaar sinds gew) van het OUDSTE dataset in deze hexagon — niet
    // de mediaan. Getest tegen de echte data: de mediaan wordt overal
    // gedomineerd door landelijk-dekkende, vaak-ververste referentielagen
    // (BRT, LGN, CBS-grenzen e.d.) die in vrijwel elke hexagon meetellen,
    // waardoor 90% van de hexagons als "~1 jaar oud" scoorde — geen enkel
    // onderscheid. De oudste-dataset-per-hexagon geeft wél een reëel signaal:
    // ~82% van de hexagons ligt onder de 2,3 jaar, maar een duidelijke groep
    // (~15%) bevat een dataset van 25+ jaar oud (bv. "Bos en hei 1900",
    // "EG-Habitatrichtlijngebied 2000") — precies de vergeten/verweesde data
    // die deze weergave moet opsporen.
    // Een handvol records heeft een datum in de toekomst (foutieve metadata,
    // bv. "2099"); geclampt op 0 i.p.v. apart uitgesloten, te weinig gevallen
    // om een aparte "excluded"-categorie voor te verzinnen.
    const ages = [...dsIds]
      .map(id => Date.parse(nodeById.get(id)?.gew))
      .filter(Number.isFinite)
      .map(t => Math.max(0, (now - t) / YEAR_MS));
    const maxAge = ages.length ? Math.max(...ages) : 0;
    return { type: 'Feature', properties: { h3: idx, count: dsIds.size, maxAge }, geometry: { type: 'Polygon', coordinates: [boundary] } };
  });
  return { fc: { type: 'FeatureCollection', features }, included, excluded, cellDatasets };
}

// Gescoped analyse: "graaf eerst" — dit aggregeert alleen wat de huidige
// vraag al opleverde, niet de hele catalogus. Geen paneel-overname (de
// resultatenlijst blijft zichtbaar), geen "eenmalig ~3 sec"-melding nodig —
// bij hooguit 15 datasets is dit altijd vrijwel instant.
async function analyzeResultsOnMap(datasetIds) {
  const statusEl = document.getElementById('analyze-status');
  const data = await computeCoverageData(datasetIds);

  if (!data.fc.features.length) {
    statusEl.className = 'result-status error';
    statusEl.textContent = 'Geen van deze resultaten heeft een bruikbare locatie.';
    return;
  }

  clearMapLayers();
  renderCoverageLayer(data, 'scoped', 'Zoekresultaten op de kaart');
  const bounds = boundsOf(data.fc);
  if (bounds) window.map.fitBounds(bounds, { padding: 60, maxZoom: 10, duration: 600 });

  statusEl.className = 'result-status ok';
  statusEl.innerHTML = `✓ ${data.fc.features.length.toLocaleString('nl-NL')} hexagons getoond — klik een hexagon voor details
    <div id="analyze-legend" class="coverage-mode-toggle-inline"></div>`;
  const legendEl = document.getElementById('analyze-legend');
  legendEl.innerHTML = coverageLegendHTML(coverageColorMode);
  wireCoverageLegend(legendEl);
}

function toggleCoverageMode() {
  if (coverageMode) exitCoverageMode(); else enterCoverageMode();
}

async function enterCoverageMode() {
  coverageMode = true;
  const toggle = document.getElementById('coverage-toggle');
  toggle.classList.add('active');
  toggle.textContent = '← Terug naar vragen';
  document.getElementById('ask-form').style.display = 'none';
  clearMapLayers();

  const body = document.getElementById('panel-body');
  body.innerHTML = '<div class="empty"><span class="kg-spinner"></span>Dekkingskaart berekenen (eenmalig, ~3 sec)…</div>';

  if (!coverageData) {
    await new Promise(r => setTimeout(r, 30)); // laat de spinner één keer renderen vóór de eerste chunk start
    coverageData = await computeCoverageData(); // async, yieldt periodiek — blokkeert de tab niet meer voor de volle ~3,6 sec
  }

  renderCoverageMap(coverageData);
}

function exitCoverageMode() {
  coverageMode = false;
  const toggle = document.getElementById('coverage-toggle');
  toggle.classList.remove('active');
  toggle.textContent = '📊 Landelijke dekkingskaart';
  document.getElementById('ask-form').style.display = '';
  clearMapLayers();
  document.getElementById('map-legend').style.display = 'none';
  renderEmptyStateWithHubs();
  window.map.flyTo({ center: [5.3, 52.15], zoom: 6.7, duration: 600 });
}

// Kleurmodus geldt voor beide weergaven (landelijk + gescoped) — herstijlt
// alleen de bestaande laag (map.setPaintProperty), geen hercomputatie nodig
// want maxAge/count zitten al op elke feature.
let coverageColorMode = 'density'; // 'density' | 'freshness'

function coverageFillColorExpr(colorMode, maxCount) {
  if (colorMode === 'freshness') {
    // Stops afgestemd op de echte verdeling: ~82% van de hexagons < 2,3 jaar,
    // dan een duidelijke sprong naar een cluster rond 25 jaar oud.
    return [
      'interpolate', ['linear'], ['get', 'maxAge'],
      0,   '#3fbf9f',
      1,   '#5b8cff',
      2.5, '#a78bfa',
      10,  '#ff7cc3',
      26,  '#ff9d7c',
    ];
  }
  // Stops schalen mee met maxCount i.p.v. vaste absolute grenzen (2/11/51/501).
  // Bug gevonden via een browser-stacktrace: bij een gescoped analyse (≤15
  // datasets) is maxCount vaak < 501, waardoor de laatste vaste stop
  // (log(maxCount+1)) KLEINER werd dan eerdere stops — MapLibre eist strikt
  // oplopende interpolate-stops en addLayer gooide een exception. Omdat die
  // exception in dezelfde functie vóór de map.on('click', ...)-registratie
  // zat, werd de klik-handler nooit gezet: hexagons toonden prima kleur, maar
  // klikken deed zichtbaar niets. Dynamische schaling lost het bij de bron op
  // i.p.v. per-geval te patchen.
  const colors = ['#1a2f52', '#2d4a7a', '#5b8cff', '#a78bfa', '#ff7cc3'];
  if (maxCount < 2) return colors[colors.length - 1]; // alle hexagons gelijk (vaak 1) — vlakke kleur, geen zinvolle schaal
  const lo = Math.log(2), hi = Math.log(maxCount + 1);
  const expr = ['interpolate', ['linear'], ['ln', ['+', ['get', 'count'], 1]]];
  colors.forEach((c, i) => expr.push(lo + (hi - lo) * (i / (colors.length - 1)), c));
  return expr;
}

function coverageLegendHTML(colorMode) {
  const colors = colorMode === 'freshness'
    ? ['#3fbf9f', '#5b8cff', '#a78bfa', '#ff7cc3', '#ff9d7c']
    : ['#1a2f52', '#2d4a7a', '#5b8cff', '#a78bfa', '#ff7cc3'];
  const labels = colorMode === 'freshness' ? ['recent', 'oud'] : ['weinig data', 'veel data'];
  return `
    <div class="coverage-mode-toggle">
      <button class="color-mode-btn${colorMode === 'density' ? ' active' : ''}" data-mode="density" type="button">Dichtheid</button>
      <button class="color-mode-btn${colorMode === 'freshness' ? ' active' : ''}" data-mode="freshness" type="button">Actualiteit</button>
    </div>
    <div class="coverage-legend-scale">${colors.map(c => `<span style="background:${c}"></span>`).join('')}</div>
    <div class="coverage-legend-labels"><span>${labels[0]}</span><span>${labels[1]}</span></div>`;
}

function wireCoverageLegend(containerEl) {
  containerEl.querySelectorAll('.color-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setCoverageColorMode(btn.dataset.mode);
      containerEl.innerHTML = coverageLegendHTML(btn.dataset.mode);
      wireCoverageLegend(containerEl);
    });
  });
}

function updateMapLegendText(title) {
  const sub = coverageColorMode === 'freshness'
    ? 'Oudste dataset per hexagon (jaar sinds laatste update)'
    : 'Aantal datasets per hexagon';
  document.getElementById('map-legend').innerHTML = `<b>${esc(title)}</b><br>${sub}`;
}

function setCoverageColorMode(newMode) {
  coverageColorMode = newMode;
  const map = window.map;
  if (activeCoverage && map.getLayer('coverage-fill')) {
    map.setPaintProperty('coverage-fill', 'fill-color', coverageFillColorExpr(newMode, activeCoverage.maxCount));
  }
  if (activeCoverage) updateMapLegendText(activeCoverage.legendTitle);
}

// Tekent alleen de kaartlaag — gebruikt door zowel de landelijke dekkingskaart
// (volledig paneel-overname) als de gescoped "analyseer deze resultaten"
// (paneel blijft de zoekresultaten tonen, alleen de kaart verandert).
function renderCoverageLayer(data, mode, legendTitle) {
  const map = window.map;
  const maxCount = data.fc.features.reduce((m, f) => Math.max(m, f.properties.count), 1);

  map.addSource('coverage', { type: 'geojson', data: data.fc });
  map.addLayer({
    id: 'coverage-fill', type: 'fill', source: 'coverage',
    paint: { 'fill-color': coverageFillColorExpr(coverageColorMode, maxCount), 'fill-opacity': 0.75 },
  });
  map.addLayer({
    id: 'coverage-line', type: 'line', source: 'coverage',
    paint: { 'line-color': 'rgba(5,5,16,0.15)', 'line-width': 0.5 },
  });
  map.on('click', 'coverage-fill', onCoverageClick);
  map.on('mouseenter', 'coverage-fill', () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', 'coverage-fill', () => { map.getCanvas().style.cursor = ''; });

  activeCoverage = { ...data, mode, maxCount, legendTitle };

  const legend = document.getElementById('map-legend');
  legend.style.display = 'block';
  updateMapLegendText(legendTitle);
}

function renderCoverageMap(data) {
  renderCoverageLayer(data, 'global', 'Dekkingskaart');
  window.map.flyTo({ center: [5.6, 52.1], zoom: 6.3, duration: 600 });
  renderCoverageStatsPanel(data);
}

function renderCoverageStatsPanel(data) {
  document.getElementById('panel-body').innerHTML = `
    <div class="coverage-stats">
      <div><b>${data.included.toLocaleString('nl-NL')}</b> van 5.824 datasets meegenomen</div>
      <div>${data.excluded.toLocaleString('nl-NL')} overgeslagen (onbetrouwbare of extreem grote dekking in de brondata)</div>
      <div><b>${data.fc.features.length.toLocaleString('nl-NL')}</b> hexagons · resolutie 5 (~253 km² per cel)</div>
      <div style="margin-top:6px">Klik een hexagon voor de datasets erin.</div>
    </div>
    <div id="coverage-legend-container"></div>`;
  const container = document.getElementById('coverage-legend-container');
  container.innerHTML = coverageLegendHTML(coverageColorMode);
  wireCoverageLegend(container);
}

const HEX_LIST_CAP = 100;

function onCoverageClick(e) {
  const idx = e.features[0].properties.h3;
  const dsIds = [...(activeCoverage.cellDatasets.get(idx) || [])];
  if (activeCoverage.mode === 'global') {
    showHexDatasets(dsIds);
  } else {
    showHexPopup(e.lngLat, dsIds);
  }
}

// Gescoped variant: het paneel toont al de zoekresultaten, dus geen paneel-
// overname zoals bij de landelijke kaart — een lichte popup op de kaart zelf
// volstaat. Klik op een titel = precies hetzelfde als in de resultatenlijst
// klikken (zoekt het bestaande .result-item op en hergebruikt showOnMap()).
function showHexPopup(lngLat, dsIds) {
  const nodes = dsIds.map(id => nodeById.get(id)).filter(Boolean);
  const rows = nodes.map(n => `<div class="popup-hex-item">
      <span class="popup-hex-title" data-id="${esc(n.id)}">${esc(n.label)}</span>
      <a href="${esc(n.url_opendata)}" target="_blank" rel="noopener" class="popup-hex-ngr">NGR ↗</a>
    </div>`).join('');
  const popup = new maplibregl.Popup({ maxWidth: '260px' })
    .setLngLat(lngLat)
    .setHTML(`<div class="popup-hex-list"><b>${nodes.length} dataset${nodes.length === 1 ? '' : 's'}</b>${rows}</div>`)
    .addTo(window.map);
  popup.getElement().querySelectorAll('.popup-hex-title').forEach(el => {
    el.addEventListener('click', () => {
      const node = nodeById.get(el.dataset.id);
      const itemEl = document.getElementById('status-' + cssId(el.dataset.id))?.closest('.result-item');
      if (node && itemEl) { popup.remove(); showOnMap(node, itemEl); }
    });
  });
}

function showHexDatasets(dsIds) {
  const nodes = dsIds.map(id => nodeById.get(id)).filter(Boolean)
    .sort((a, b) => (b.deg || 0) - (a.deg || 0));
  const shown = nodes.slice(0, HEX_LIST_CAP);

  const body = document.getElementById('panel-body');
  body.innerHTML = `
    <button class="hex-back" id="hex-back" type="button">← Terug naar dekkingskaart</button>
    <div class="result-count">${nodes.length.toLocaleString('nl-NL')} datasets in deze hexagon${nodes.length > HEX_LIST_CAP ? ` (eerste ${HEX_LIST_CAP} getoond)` : ''}</div>
    <div id="hex-result-list"></div>`;
  document.getElementById('hex-back').addEventListener('click', () => renderCoverageStatsPanel(coverageData));

  const list = document.getElementById('hex-result-list');
  shown.forEach(n => list.appendChild(buildResultItem(n)));
}

function renderExtentOnMap(node, extent) {
  const map = window.map;
  clearMapLayers();

  const [minLon, minLat, maxLon, maxLat] = extent;
  const ring = [[minLon, minLat], [maxLon, minLat], [maxLon, maxLat], [minLon, maxLat], [minLon, minLat]];
  map.addSource('extent', { type: 'geojson', data: { type: 'Feature', geometry: { type: 'Polygon', coordinates: [ring] }, properties: {} } });
  map.addLayer({ id: 'extent-fill', type: 'fill', source: 'extent', paint: { 'fill-color': '#ff9d7c', 'fill-opacity': 0.08 } });
  map.addLayer({ id: 'extent-line', type: 'line', source: 'extent', paint: { 'line-color': '#ff9d7c', 'line-width': 2, 'line-dasharray': [3, 2] } });

  map.fitBounds([[minLon, minLat], [maxLon, maxLat]], { padding: 40, maxZoom: 13, duration: 600 });

  const legend = document.getElementById('map-legend');
  legend.style.display = 'block';
  legend.innerHTML = `<b>${esc(node.label)}</b><br>Dekkingsgebied (indicatief) · geen kaartservice beschikbaar`;
}

function renderWmsOnMap(node, wms) {
  const map = window.map;
  clearMapLayers();

  const tileUrl = '/api/ngr-wms-tile?' + new URLSearchParams({ wmsUrl: wms.url, layer: wms.layer }) + '&bbox={bbox-epsg-3857}';
  map.addSource('wms', { type: 'raster', tiles: [tileUrl], tileSize: 256 });
  map.addLayer({ id: 'wms-raster', type: 'raster', source: 'wms', paint: { 'raster-opacity': 0.85 } });

  if (currentBbox) {
    map.fitBounds([[currentBbox[0], currentBbox[1]], [currentBbox[2], currentBbox[3]]], { padding: 40, duration: 600 });
  }

  const legend = document.getElementById('map-legend');
  legend.style.display = 'block';
  legend.innerHTML = `<b>${esc(node.label)}</b><br>WMS-weergave · ${esc(wms.layer)}`;
}

function renderOnMap(gj, node, typeName) {
  const map = window.map;
  clearMapLayers();
  map.addSource('wfs', { type: 'geojson', data: gj });

  const t = gj.features[0]?.geometry?.type || '';
  let clickLayer;
  if (t.includes('Polygon')) {
    map.addLayer({ id: 'wfs-fill', type: 'fill', source: 'wfs', paint: { 'fill-color': '#5b8cff', 'fill-opacity': 0.25 } });
    map.addLayer({ id: 'wfs-line', type: 'line', source: 'wfs', paint: { 'line-color': '#a78bfa', 'line-width': 1 } });
    clickLayer = 'wfs-fill';
  } else if (t.includes('Line')) {
    map.addLayer({ id: 'wfs-line', type: 'line', source: 'wfs', paint: { 'line-color': '#a78bfa', 'line-width': 2.5 } });
    clickLayer = 'wfs-line';
  } else {
    map.addLayer({ id: 'wfs-circle', type: 'circle', source: 'wfs',
      paint: { 'circle-radius': 4.5, 'circle-color': '#5b8cff', 'circle-stroke-width': 1, 'circle-stroke-color': '#050510' } });
    clickLayer = 'wfs-circle';
  }

  map.on('click', clickLayer, onFeatureClick);
  map.on('mouseenter', clickLayer, () => { map.getCanvas().style.cursor = 'pointer'; });
  map.on('mouseleave', clickLayer, () => { map.getCanvas().style.cursor = ''; });

  const bounds = boundsOf(gj);
  if (bounds) map.fitBounds(bounds, { padding: 40, maxZoom: 15, duration: 600 });

  const legend = document.getElementById('map-legend');
  legend.style.display = 'block';
  legend.innerHTML = `<b>${esc(node.label)}</b><br>${gj.features.length.toLocaleString('nl-NL')} features · ${esc(typeName.split(':').pop())}`;
}

function onFeatureClick(e) {
  const p = e.features[0].properties;
  const rows = Object.entries(p).filter(([, v]) => v !== null && v !== '').slice(0, 16)
    .map(([k, v]) => `<div><b>${esc(k)}</b>${esc(String(v))}</div>`).join('');
  new maplibregl.Popup({ maxWidth: '300px' }).setLngLat(e.lngLat)
    .setHTML(`<div class="popup-inner">${rows}</div>`).addTo(window.map);
}

function boundsOf(gj) {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  function walk(coords) {
    if (typeof coords[0] === 'number') {
      const [x, y] = coords;
      if (isFinite(x) && isFinite(y)) {
        if (x < minX) minX = x; if (x > maxX) maxX = x;
        if (y < minY) minY = y; if (y > maxY) maxY = y;
      }
    } else {
      coords.forEach(walk);
    }
  }
  gj.features.forEach(f => f.geometry && walk(f.geometry.coordinates));
  if (minX === Infinity) return null;
  return [[minX, minY], [maxX, maxY]];
}

init();
</script>
